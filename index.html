/* ---------- The club's music player ---------- */
const audio = $('#audio');
const trackById = (id) => (D().tracks || []).find((t) => t.id === id);
const SILENT = 'data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
const SONGS = 'songs-dram';   // songs from Google Drive, kept on the phone after the first play
const isDrive = (t) => !!(C.driveId && C.driveId(t.url));
const songKey = (t) => `./song/${t.id}-${C.fnv(t.url)}`;
function setSrc(u) {
  const old = audio.getAttribute('src');
  audio.src = u;
  if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
}
// Google Drive won't stream to other websites' players, so a Drive song comes through the club's Apps Script
async function driveSong(t) {
  try { const c = await caches.open(SONGS); const hit = await c.match(songKey(t)); if (hit) return { url: URL.createObjectURL(await hit.blob()) }; } catch {}
  const j = await api('song', { trackId: t.id });
  if (j.preview) return { preview: j.driveId || C.driveId(t.url), size: j.size };
  const blob = await (await fetch(`data:${j.mime || 'audio/mpeg'};base64,${j.b64}`)).blob();
  try {
    const c = await caches.open(SONGS);
    await c.put(songKey(t), new Response(blob, { headers: { 'Content-Type': blob.type } }));
    const keys = await c.keys(); for (const k of keys.slice(0, Math.max(0, keys.length - 40))) await c.delete(k);   // keep the latest 40
  } catch {}
  return { url: URL.createObjectURL(blob) };
}
async function playTrack(id) {
  const t = trackById(id);
  if (!t) return;
  if (S.play.id === id && !S.play.bad[id] && !S.play.loading && audio.getAttribute('src') && audio.getAttribute('src') !== SILENT) {   // carry on where it paused
    audio.play().catch(() => {}); return;
  }
  S.play.id = id; delete S.play.bad[id]; S.play.alt = 0;
  if (!isDrive(t)) setSession(t);   // a Drive song gets its lock-screen entry once it's here to play
  if (isDrive(t)) {
    // phones only allow sound that starts from a tap: start a moment of silence now, the song once it arrives
    S.play.loading = id; setSrc(SILENT); audio.play().catch(() => {});
    syncPlayer();
    const slow = setTimeout(() => { if (S.play.loading === id) busyToast('Fetching the song from Google Drive…'); }, 600);
    let r;
    try { r = await driveSong(t); }
    catch (err) {
      clearTimeout(slow);
      if (S.play.id !== id) return;
      S.play.loading = null;
      if (/Unknown action/.test(err.message)) { S.play.srcs = C.audioSources(t.url); setSrc(S.play.srcs[0]); }   // an older Apps Script: try Drive's links
      else { failTrack(t, friendly(err)); return; }
    }
    clearTimeout(slow);
    if (S.play.id !== id) { if (!S.play.loading) endBusy(); return; }   // they picked another song meanwhile
    S.play.loading = null;
    if (r && r.preview) { endBusy(); stopPlayer(); openDrivePlayer(t, r); return; }
    if (r) { S.play.srcs = [r.url]; setSrc(r.url); }
    setSession(t);
    toast(`Playing “${t.title}”`);
  } else {
    S.play.srcs = C.audioSources(t.url); setSrc(S.play.srcs[0]);   // a Suno song tries its open MP4 first
  }
  audio.play().catch((err) => { if (err && err.name === 'NotAllowedError') toast('Tap play again to start the song'); });   // a link that fails fires the error event
  syncPlayer();
}
function openDrivePlayer(t, r) {
  const mb = Math.round((r.size || 0) / 1048576);
  openSheet(`${head(esc(t.title))}<p>${esc(t.artist || clubName())}</p>
    <div class="video" style="aspect-ratio:auto;height:120px;background:var(--raise-2)"><iframe src="https://drive.google.com/file/d/${encodeURIComponent(r.preview)}/preview" title="${esc(t.title)}" allow="autoplay"></iframe></div>
    <p class="small" style="margin-top:10px">At ${mb} MB this one is too big to come through Dram, so it plays in Google Drive’s own player and stops when you close this.${amAdmin() ? ' An MP3 of it plays with the full controls.' : ''}</p>`);
}
// Suno won't hand over this song's file, so play it in Suno's own player
function openSunoPlayer(t, id) {
  stopPlayer();
  openSheet(`${head(esc(t.title))}<p>${esc(t.artist || clubName())}</p>
    <div class="video" style="aspect-ratio:auto;height:240px;background:var(--raise-2)"><iframe src="https://suno.com/embed/${encodeURIComponent(id)}" title="${esc(t.title)}" allow="autoplay; encrypted-media"></iframe></div>
    <p class="small" style="margin-top:10px">Suno keeps this song in its own player, so it plays here and stops when you close this.</p>`);
}
// A link that won't play: try the file's other links (Google Drive and Suno have several), then say so
function onAudioError() {
  const t = S.play.id && trackById(S.play.id);
  if (!t || !audio.getAttribute('src') || S.play.loading || audio.getAttribute('src') === SILENT) return;
  if (S.play.srcs && S.play.alt < S.play.srcs.length - 1) { S.play.alt++; audio.src = S.play.srcs[S.play.alt]; audio.play().catch(() => {}); return; }
  const sid = C.sunoId && C.sunoId(t.url);
  if (sid) { openSunoPlayer(t, sid); return; }
  failTrack(t);
}
function pausePlayer() { if (!audio.paused) audio.pause(); }
function stopPlayer() { if (!audio) return; audio.pause(); audio.removeAttribute('src'); try { audio.load(); } catch {} S.play.id = null; endSession(); syncPlayer(); }
// Take Dram off the lock screen and out of the notifications when nothing is playing
function endSession() {
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; } catch {}
  for (const a of ['play', 'pause', 'previoustrack', 'nexttrack', 'seekto']) { try { navigator.mediaSession.setActionHandler(a, null); } catch {} }
}
function stepTrack(dir) {
  const ts = D().tracks || [];
  if (!ts.length) return;
  if (dir < 0 && audio.currentTime > 3) { audio.currentTime = 0; return; }
  const i = ts.findIndex((t) => t.id === S.play.id);
  const j = i < 0 ? 0 : i + dir;
  if (j < 0) { audio.currentTime = 0; return; }
  if (j >= ts.length) { stopPlayer(); toast('That was the last song'); return; }
  playTrack(ts[j].id);
}
function failTrack(t, why) {
  S.play.bad[t.id] = 1; S.play.loading = null;
  toast(why ? `Couldn’t play “${t.title}”. ${why}` : isDrive(t) ? `Couldn’t play “${t.title}” from Google Drive. Ask whoever looks after the club to check it’s shared with “Anyone with the link”.`
    : `Couldn’t play “${t.title}”. Its link must be an audio file anyone can open.`);
  syncPlayer();
}
function setSession(t) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist || clubName(), album: 'Dram',
      artwork: [{ src: new URL('icon-512.png', appUrl()).href, sizes: '512x512', type: 'image/png' }, { src: new URL('icon-192.png', appUrl()).href, sizes: '192x192', type: 'image/png' }] });
    const on = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    on('play', () => audio.play()); on('pause', () => audio.pause());
    on('previoustrack', () => stepTrack(-1)); on('nexttrack', () => stepTrack(1));
    on('seekto', (e) => { if (e.seekTime != null) audio.currentTime = e.seekTime; });
  } catch {}
}
// Update the player in place: never re-render the list while someone is dragging the position
function syncPlayer() {
  const playing = !!S.play.id && !audio.paused;
  if (S.tab === 'media' && (S.mediaView || ((D().tracks || []).length ? 'music' : 'youtube')) === 'music' && $('#nowPlaying')) {
    if (document.activeElement && document.activeElement.id === 'scrub') { renderMini(); return; }
    const y = scrollY; renderMain(); scrollTo(0, y);
  }
  renderMini();
  try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = S.play.id ? (playing ? 'playing' : 'paused') : 'none'; } catch {}
}
function renderMini() {
  const el = $('#mini'), t = S.play.id && trackById(S.play.id);
  const onMusic = S.tab === 'media' && (S.mediaView || 'music') === 'music';
  const show = !!t && !onMusic && !S.screen && !!S.me;
  el.hidden = !show;
  document.body.classList.toggle('has-mini', show);
  if (!show) return;
  const playing = !audio.paused && !S.play.loading;
  el.innerHTML = `<div class="mini-in"><img src="mark.webp" alt=""><button class="mini-text" type="button" data-act="open-music"><b>${esc(t.title)}</b><span>${playing ? 'Playing' : 'Paused'}, ${esc(t.artist || clubName())}</span><span class="mini-prog"><i id="miniProg"></i></span></button>
    <button class="round${playing ? '' : ' accent'}" type="button" data-act="playpause" data-track="${esc(t.id)}" aria-label="${playing ? 'Pause' : 'Play'}" title="${playing ? 'Pause' : 'Play'}">${playing ? ICON.pause : ICON.playFill}</button>
    <button class="round" type="button" data-act="stop-music" aria-label="Stop the music" title="Stop">${ICON.x}</button></div>`;
  tick();
}
function tick() {
  const d = audio.duration, at = audio.currentTime;
  const p = $('#miniProg'); if (p) p.style.width = d ? `${(at / d) * 100}%` : '0';
  if (document.activeElement && document.activeElement.id === 'scrub') return;
  const sc = $('#scrub'); if (sc && d) sc.value = Math.round((at / d) * 1000);
  const a = $('#npAt'); if (a) a.textContent = fmtTime(at);
}
audio.addEventListener('timeupdate', tick);
audio.addEventListener('play', syncPlayer);
audio.addEventListener('pause', syncPlayer);
audio.addEventListener('loadedmetadata', () => {
  if (!S.play.id || !isFinite(audio.duration) || S.play.loading || audio.getAttribute('src') === SILENT) return;

async function saveMeet(btn) {
  const e = readEditor(), res = $('#edResult');
  if (!e.at || isNaN(e.at)) { res.textContent = 'Pick a date.'; return; }
  for (const [k, label] of [['slides', 'The slides link'], ['video', 'The song or video link']]) {
    if (e[k] && !/^https:\/\//i.test(e[k])) { res.textContent = `${label} must start with https://`; return; }
  }
  const old = e.id && meetById(e.id);
  await withBusy(btn, async () => {
    res.textContent = '';
    try {
      e.lineup.forEach((d) => { const w = d.whiskyId && S.byId.get(d.whiskyId); const p = w && picFor(w); if (!d.snap.image && p && p.kind === 'bottle') d.snap.image = p.u; });
      // a blind line-up this phone can't see isn't sent: the server keeps the real one
      const payload = { id: e.id, at: e.at, host: e.host, place: e.place, notes: e.notes, slides: e.slides, video: e.video, blind: e.blind, lineup: e.hiddenLineup || e.revealed ? undefined : e.lineup };
      const j = await call('saveMeet', { meet: payload });
      const saved = meetById(j.savedId);
      closeSheet(); S.edit = null; renderAll();
      let told = '';
      if (e.tell && saved) {
        const moved = old && (old.at !== saved.at || old.place !== saved.place);
        if (!old || moved) {
          const title = old ? `Meet moved: ${longDate(saved.at)}` : `New meet: ${longDate(saved.at)}`;
          const ok = await tellClub(title, `${time(saved.at)}. ${meetStory(saved)} Open Dram to say if you’re in.`);

        }
      }

  });
}

    case 'close': closeSheet(); break;
    case 'music-add': openAddSong(); break;
    case 'playpause': if (S.play.loading && S.play.loading === (d.track || S.play.id)) break; if (S.play.id && S.play.id === d.track && !audio.paused) audio.pause(); else playTrack(d.track || S.play.id); break;
    case 'prev': stepTrack(-1); break;
    case 'next-track': if (!S.play.id) { const ts = D().tracks || []; if (ts[0]) playTrack(ts[Math.min(1, ts.length - 1)].id); } else stepTrack(1); break;
    case 'stop-music': stopPlayer(); break;
    case 'open-music': S.tab = 'media'; S.mediaView = 'music'; put('tab', S.tab); closeSheet(); renderAll(); window.scrollTo(0, 0); break;
    case 'media-refresh': loadMedia(true); break;
    case 'admin-open': openSettings('adminHead'); break;
    case 'step-down': {
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again: you’ll leave the club on every phone'; setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = 'Step down and leave'; } }, 5000); break; }
      await withBusy(t, async () => {
        try { await api('stepDown'); signOut(''); toast('You’ve stepped down and left the club'); }
        catch (err) { $('#stepResult').textContent = friendly(err); }
      });
      break;
    }
    case 'invite': {
      const pin = D().club && D().club.pin;
      if (!pin) { $('#inviteResult').textContent = 'Only the administrator can share invites.'; break; }
      const msg = `You’re invited to ${clubName()} on Dram, the club’s app. Open ${appUrl()} on your phone, enter the club PIN ${pin}, then pick your name.`;
      let done = false;
      if (navigator.share) { try { await navigator.share({ title: `${clubName()} on Dram`, text: msg }); done = true; } catch (err) { if (err && err.name === 'AbortError') break; } }
      if (!done) {
        try { await navigator.clipboard.writeText(msg); $('#inviteResult').textContent = 'Invite copied. Paste it into a message to them.'; toast('Invite copied'); }
        catch { $('#inviteResult').textContent = msg; }
      } else $('#inviteResult').textContent = 'Invite shared.';
      break;
    }
    case 'save-media': case 'ig-off': {
      await withBusy(t, async () => {
        const res = $('#mediaResult');
        const data = d.act === 'ig-off' ? { igToken: '' } : { youtube: $('#ytLink').value.trim(), instagram: $('#igUser').value.trim() };
        const tok = d.act === 'save-media' ? $('#igToken').value.trim() : '';
        if (tok) data.igToken = tok;
        try {
          const j = await call('setMedia', data);
          S.media = null; del('media'); loadMedia(true);
          openSettings('mediaHead');
          const r = (j.mediaResult && j.mediaResult.instagram) || 'Media saved.';
          $('#mediaResult').textContent = r; toast(r);
        } catch (err) { res.textContent = friendly(err); }
      });
      break;
    }
    case 'retry': withBusy(t, () => refresh(false)); break;
    case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; renderNotices(); } break;
    case 'connect': openConnect(); break;
    case 'connected': S.connected = true; put('connected', true); closeSheet(); renderNotices(); toast('Notifications are set up'); break;
    case 'copy': try { await navigator.clipboard.writeText(D().club.topic); toast('Code copied'); } catch { toast('Press and hold the code to copy it'); } break;
    case 'hello': {
      await withBusy(t, async () => {
        const ok = await tellClub(amDev() ? 'Dram developer test' : `${myName()} is on Dram`, amDev() ? 'Only your developer topic gets this.' : 'Club messages arrive here: meet reminders, new meets, revealed scores and limited releases.');
        $('#connectResult').textContent = ok ? `Sent at ${time(Date.now())}. It should appear in ntfy in a few seconds.` : 'Couldn’t reach ntfy. Check your connection and try again.';
        toast(ok ? 'Test sent to the club' : 'Couldn’t reach ntfy');
      });
      break;
    }
    case 'test-reminder': {
      await withBusy(t, async () => {
        const res = $('#testResult');
        try {
          const j = await call('testNotify');
          res.textContent = j.test && j.test.ok ? `Sent at ${time(j.test.at)}. It should reach ntfy within a minute.` : (j.test && j.test.reason) || 'It didn’t send.';
          toast(j.test && j.test.ok ? 'Test reminder sent' : 'The test reminder didn’t send');
        } catch (err) { res.textContent = friendly(err); toast(friendly(err)); }
      });
      break;
    }
    case 'new-meet': openEditor(null); break;
    case 'edit-meet': openEditor(meetById(d.meet)); break;
    case 'ed-blind': readEditor(); S.edit.blind = !S.edit.blind; t.setAttribute('aria-checked', String(S.edit.blind)); break;
    case 'ed-tell': readEditor(); S.edit.tell = !S.edit.tell; t.setAttribute('aria-checked', String(S.edit.tell)); break;
    case 'pick': openPick(); break;
    case 'pick-back': renderEditor(); break;
    case 'pick-custom': {
      const q = ($('#pickQ').value || '').trim();
      if (!q) break;
      S.edit.lineup.push(lineupItem(null, q.slice(0, 120)));
      renderEditor(); toast(`${q} added to the line-up`);
      break;
    }
    case 'save-meet': saveMeet(t); break;
    case 'delete-meet': {
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to delete, with its scores'; setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = 'Delete meet'; } }, 4000); break; }
      await withBusy(t, async () => { try { await call('deleteMeet', { id: S.edit.id }); closeSheet(); S.edit = null; renderAll(); toast('Meet deleted'); } catch (err) { $('#edResult').textContent = friendly(err); } });
      break;
    }
    case 'tasting': openScreen('tasting', d.meet); refresh(true); break;
    case 'results': openScreen('results', d.meet); break;
    case 'screen-back': goBack(); break;
    case 'save-score': saveScore(t.closest('.dram'), t); break;
    case 'reveal': revealScores(t); break;
    case 'next': showNext(1); break;
    case 'wish': toggleWish(t); break;
    case 'search': if (!S.cat) { toast('The whisky list is still loading'); break; } openSearch(); break;
    case 'cat-retry': catPromise = null; S.catErr = ''; renderMain(); loadCatalogue(); break;
    case 'finds-now': {
      await withBusy(t, async () => {
        busyToast('Looking for new limited releases…');
        try { await call('findsNow'); renderMain(); const i = D().findsInfo; toast(i && i.ok ? (i.added ? `${plural(i.added, 'new find')}. Next look on Friday.` : 'Nothing new. Next look on Friday.') : (i && i.reason) || 'Couldn’t look just now'); }
        catch (err) { toast(friendly(err)); }
      });
      break;
    }
    case 'switch-me': closeSheet(); S.me = ''; put('me', ''); renderAll(); break;
    case 'signout': signOut(''); break;
    case 'save-club': {
      await withBusy(t, async () => {
        const name = $('#clubName').value.trim(), res = $('#clubResult');
        try { await call('setClub', { name }); res.textContent = 'Saved.'; renderAll(); toast('Club name saved'); } catch (err) { res.textContent = friendly(err); }
      });
      break;
    }
  }
});
$('#themeBtn').addEventListener('click', () => { setLook(isLight() ? 'dark' : 'light'); });
$('#settingsBtn').addEventListener('click', () => openSettings());

function syncDram(card, keepSaved) {
  const dv = draft[card.dataset.k];
  const big = card.querySelector('[data-big]');
  big.textContent = dv.score == null ? '–' : dv.score.toFixed(1);
  big.classList.toggle('unset', dv.score == null);
  if (dv.score != null) card.querySelector('[data-range]').value = dv.score;
  const [meetId, dramId] = card.dataset.k.split(':');
  const s = myScore(meetId, dramId);
  const changed = !s || s.score !== dv.score || s.note !== dv.note || s.tags.join() !== dv.tags.join();
  const btn = card.querySelector('[data-act=save-score]');
  btn.disabled = dv.score == null;
  btn.classList.toggle('primary', changed);
  card.querySelector('.saved').innerHTML = s && !changed ? `<span class="tick">${ICON.tick}</span>Saved` : s ? 'Changed, not saved yet' : 'Not scored yet';
}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-range]')) { const card = t.closest('.dram'); draft[card.dataset.k].score = C.clampScore(t.value); syncDram(card); }
  else if (t.matches('[data-note]')) { const card = t.closest('.dram'); draft[card.dataset.k].note = t.value; syncDram(card); }
  else if (t.id === 'scrub') { if (audio.duration) audio.currentTime = (t.value / 1000) * audio.duration; }
  else if (t.id === 'pickQ') renderPick();
  else if (t.id === 'searchQ') renderSearch();
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'pinForm') {
    const pin = $('#pinIn').value.trim();
    if (!pin) return;
    const btn = f.querySelector('button');
    await withBusy(btn, async () => {
      S.pin = pin;
      try { await call('state'); put('pin', pin); S.gateErr = ''; renderAll(); }
      catch (err) { S.pin = ''; S.gateErr = friendly(err); $('#gateErr').textContent = S.gateErr; }
    });
    return;
  }
  if (f.id === 'newMember' || f.id === 'addMemberForm') {
    const inp = f.querySelector('input'), name = inp.value.trim();
    if (!name) return;
    await withBusy(f.querySelector('button'), async () => {
      try {
        await call('addMember', { name });
        if (f.id === 'newMember') { const m = D().members.find((x) => x.name.toLowerCase() === name.toLowerCase()); if (m) { S.me = m.id; put('me', S.me); } renderAll(); toast(`Welcome, ${name}`); }
        else { openSettings(); toast(`${name} added`); }
      } catch (err) { if (f.id === 'addMemberForm') $('#memberResult').textContent = friendly(err); else toast(friendly(err)); }
    });
    return;
  }
  if (f.id === 'adminForm') {
    const code = $('#adminPin').value.trim();
    if (!code) return;
    await withBusy(f.querySelector('button'), async () => {
      const keep = S.admin; S.admin = code;
      try { const j = await call('adminUnlock'); if (!j.isAdmin) throw new Error('That admin PIN isn’t right.'); put('admin', code); renderAll(); openSettings('adminHead'); toast('You look after the club now'); }
      catch (err) { S.admin = keep; $('#adminResult').textContent = friendly(err); }
    });
    return;
  }
  if (f.id === 'musicForm') {
    const url = $('#mUrl').value.trim();
    if (!url) return;
    await withBusy(f.querySelector('button[type=submit]'), async () => {
      $('#mResult').textContent = 'Checking the link…';
      try {
        const j = await call('addTrack', { url, title: $('#mTitle').value.trim(), artist: $('#mArtist').value.trim() });
        const note = j.trackNote || 'Song added.';
        closeSheet(); renderMain(); renderMini(); toast(note);
      } catch (err) { $('#mResult').textContent = friendly(err); }
    });
    return;
  }
  if (f.id === 'trackForm') {
    const url = $('#trackUrl').value.trim();
    if (!url) return;
    await withBusy(f.querySelector('button'), async () => {
      busyToast('Adding the song…');
      try { const j = await call('addTrack', { url, title: $('#trackTitle').value.trim(), artist: $('#trackArtist').value.trim() }); openSettings('mediaHead'); const note = j.trackNote || 'Song added.'; $('#trackResult').textContent = note; toast(note.split('.')[0]); }
      catch (err) { $('#trackResult').textContent = friendly(err); toast(friendly(err)); }
    });
    return;
  }
  if (f.dataset.renameform) {
    const name = f.querySelector('input').value.trim();
    await withBusy(f.querySelector('button'), async () => {
      try { await call('renameMember', { id: f.dataset.renameform, name }); renderAll(); openSettings(); toast('Name changed'); } catch (err) { $('#memberResult').textContent = friendly(err); }
    });
  }
});

/* ---------- Gestures ---------- */
// One helper: decide the direction after 10px; only a sideways (or downward) drag is ours.
function drag(el, opts) {
  let st = null;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { st = null; return; }
    const t = e.touches[0], tg = e.target;
    if (tg.closest('input, textarea, select') || (opts.skip && opts.skip(tg, t))) { st = null; return; }
    if (String(getSelection && getSelection()).length) { st = null; return; }
    st = { x: t.clientX, y: t.clientY, t: Date.now(), dir: null, dx: 0, dy: 0 };
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (!st) return;
    const t = e.touches[0];
    st.dx = t.clientX - st.x; st.dy = t.clientY - st.y;
    if (!st.dir) {
      if (Math.hypot(st.dx, st.dy) < 10) return;
      const horiz = Math.abs(st.dx) > Math.abs(st.dy);
      st.dir = opts.axis === 'y' ? (!horiz && st.dy > 0 ? 'y' : 'none') : horiz ? 'x' : 'none';
      if (st.dir === 'none') { st = null; return; }
      if (opts.axis === 'x' && opts.onlyRight && st.dx < 0) { st = null; return; }
    }
    e.preventDefault();
    opts.move(st);
  }, { passive: false });
  const end = () => {
    if (!st || !st.dir) { st = null; return; }
    const v = (opts.axis === 'y' ? st.dy : st.dx) / Math.max(1, Date.now() - st.t);
    opts.end(st, v);
    st = null;
  };
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', () => { if (st && st.dir) opts.cancel && opts.cancel(st); st = null; });
}
const scrollsSideways = (el) => {
  for (let n = el; n && n !== document.body; n = n.parentElement) {
    const ox = getComputedStyle(n).overflowX;
    if ((ox === 'auto' || ox === 'scroll') && n.scrollWidth > n.clientWidth) return true;
  }
  return false;
};
const edgeSkip = (tg, t) => scrollsSideways(tg) || (!standalone && t.clientX < 24);
const springBack = (el) => { el.style.transition = reduced() ? 'none' : 'transform .22s ease'; el.style.transform = ''; setTimeout(() => { el.style.transition = ''; }, 240); };
const arrow = (p) => { const a = $('#backArrow'); a.innerHTML = ICON.back; a.style.opacity = String(Math.min(1, p)); };

// Full-screen layer: swipe right to go back
drag($('#screen'), {
  axis: 'x', onlyRight: true, skip: edgeSkip,
  move: (st) => { const dx = Math.max(0, st.dx); if (!reduced()) $('#screen').style.transform = `translateX(${dx}px)`; arrow(dx / (innerWidth / 3)); },
  end: (st, v) => {
    const el = $('#screen');
    arrow(0);
    if (st.dx > innerWidth / 3 || v > 0.5) {
      if (!reduced()) { el.style.transition = 'transform .18s ease-out'; el.style.transform = `translateX(${innerWidth}px)`; }
      setTimeout(() => { el.style.transition = ''; goBack(); }, reduced() ? 0 : 180);
    } else springBack(el);
  },
  cancel: () => { arrow(0); springBack($('#screen')); },
});
// Sheets: drag the handle or title down to close
drag(sheet, {
  axis: 'y', skip: (tg) => !tg.closest('[data-grab]') || tg.closest('button'),
  move: (st) => { if (!reduced()) sheet.style.transform = `translateY(${Math.max(0, st.dy)}px)`; },
  end: (st, v) => {
    if (st.dy > sheet.offsetHeight / 4 || v > 0.5) {
      if (!reduced()) { sheet.style.transition = 'transform .18s ease-out'; sheet.style.transform = `translateY(${sheet.offsetHeight}px)`; }
      setTimeout(() => { sheet.style.transition = ''; closeSheet(); }, reduced() ? 0 : 180);
    } else springBack(sheet);
  },
  cancel: () => springBack(sheet),
});
// Drift card: swipe left for another, right for the last one
let cardBound = null;
function bindCardSwipe() {
  const card = $('#card');
  if (!card || card === cardBound) return;
  cardBound = card;
  drag(card, {
    axis: 'x', skip: (tg) => scrollsSideways(tg),
    move: (st) => { if (!reduced()) card.style.transform = `translateX(${st.dx}px) rotate(${st.dx / 40}deg)`; },
    end: (st, v) => {
      const go = Math.abs(st.dx) > innerWidth / 3 || Math.abs(v) > 0.5;
      if (!go) { springBack(card); return; }
      const dir = st.dx < 0 ? 1 : -1;
      if (dir < 0 && !S.hist.length) { springBack(card); toast('That’s the first one this time'); return; }
      if (reduced()) { showNext(dir); return; }
      card.style.transition = 'transform .16s ease-in, opacity .16s';
      card.style.transform = `translateX(${dir > 0 ? -innerWidth : innerWidth}px) rotate(${dir > 0 ? -8 : 8}deg)`;
      card.style.opacity = '0';
      setTimeout(() => showNext(dir), 160);
    },
    cancel: () => springBack(card),
  });
}

/* ---------- Opening screen ---------- */
const splashFrom = performance.now();
let splashGone = false;
function hideSplash() {
  if (splashGone) return;
  splashGone = true;
  const el = $('#splash');
  const wait = Math.max(0, 900 - (performance.now() - splashFrom));   // long enough to read, never longer than needed
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 500); }, reduced() ? Math.min(wait, 300) : wait);
}

/* ---------- Start ---------- */
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; renderNotices(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.pin) refresh(true); });
window.addEventListener('online', () => { if (S.pin) refresh(true); });
setInterval(() => { if (S.tab === 'meet' && !S.screen && !sheet.open && S.me && document.visibilityState === 'visible') renderMain(); }, 60000);
(function start() {
  $('#settingsBtn').innerHTML = ICON.sliders;
  if (S.set.theme) { delete S.set.theme; saveSet(); }   // release 1 had colour themes
  applyLook();
  renderAll();
  // Signed in with saved data: the app is ready at once. Signed in without it: wait for the club, up to 2.5 s.
  if (S.pin && !S.data) { refresh(true).then(hideSplash); setTimeout(hideSplash, 2500); }
  else { hideSplash(); if (S.pin) refresh(true); }
  if (S.tab === 'drift' || S.me) setTimeout(loadCatalogue, S.tab === 'drift' ? 0 : 1500);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
