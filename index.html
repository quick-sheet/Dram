<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dram</title>
<meta name="description" content="Our whisky club in one place: meets, tasting scores and a dram to discover.">
<meta name="theme-color" content="#0E0A06">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var m=(JSON.parse(localStorage.getItem('drm.settings')||'{}').look)||'dark';if(m==='auto')m=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';if(m==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="preload" as="image" href="logo.webp" fetchpriority="high">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dram">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>
/* Two themes drawn from the club's logo. Cask: deep oak and lamplight. Parchment: a tasting card in daylight. */
:root{--bg:#0E0A06;--raise:#18110A;--raise-2:#231910;--line:rgba(255,206,150,.09);--line-2:rgba(255,206,150,.18);
--ink:#F4E8D4;--ink-2:#BDA98E;--ink-3:#85725B;--sun:#FFA42B;--sun-ink:#FFB04A;--sun-soft:rgba(255,164,43,.16);--on-sun:#1C0F02;
--dome-in:#0A0704;--dome-out:#2B1B0C;--ice:#FFFFFF;--shadow:none;--glow:rgba(255,120,20,.22);
--sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#FBF6EE;--raise:#F3EADC;--raise-2:#EADDC8;--line:rgba(74,44,14,.10);--line-2:rgba(74,44,14,.20);
--ink:#24180C;--ink-2:#5F4A35;--ink-3:#836C55;--sun:#F0922A;--sun-ink:#A9520A;--sun-soft:rgba(240,146,42,.16);--on-sun:#1F1205;
--dome-in:#FFFDF8;--dome-out:#EEDFC8;--ice:#7A5A38;--shadow:0 1px 2px rgba(74,44,14,.06),0 8px 24px rgba(74,44,14,.07);--glow:rgba(200,110,20,.18);color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:34rem;margin:0 auto;padding:0 20px calc(96px + env(safe-area-inset-bottom));position:relative}
.wrap.gated{padding-bottom:48px}

/* Opening screen: the club's logo while Dram gets ready */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:28px;
  background:radial-gradient(120% 80% at 50% 40%,#2C1809 0%,#0D0904 62%);transition:opacity .45s ease,visibility .45s}
.splash::before{content:"";position:absolute;left:50%;top:40%;width:72vmin;height:72vmin;margin:-36vmin 0 0 -36vmin;border-radius:50%;
  background:radial-gradient(circle,rgba(255,140,20,.32),rgba(255,110,10,0) 64%);animation:glow 2.6s ease-in-out infinite alternate}
.splash img{position:relative;width:min(70vw,300px);height:auto;animation:arrive .9s cubic-bezier(.2,.8,.2,1) both}
.splash .spinner{position:relative;width:18px;height:18px;color:#EBC48A;opacity:.7;animation:spin .8s linear infinite,fadein .6s .5s both}
.splash.out{opacity:0;visibility:hidden;pointer-events:none}
@keyframes glow{from{opacity:.55;transform:scale(.94)}to{opacity:1;transform:scale(1.04)}}
@keyframes arrive{from{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes fadein{from{opacity:0}}

/* Header */
header{display:grid;grid-template-columns:1fr auto;align-items:start;padding:16px 0 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;flex:none;margin:-2px 0 0 -4px;filter:drop-shadow(0 2px 8px rgba(255,120,20,.25))}
.brand > div{min-width:0}
.mark{font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where{display:block;font-size:13px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where:empty{display:none}
.tools{display:flex;gap:2px;margin:-10px -8px 0 0}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.icon-btn:active{background:var(--raise)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[hidden]{display:none}

/* Notices */
.notice{display:flex;gap:12px;align-items:center;margin:10px 0 0;padding:10px 12px 10px 14px;border-radius:14px;background:var(--raise);font-size:14px;color:var(--ink-2)}
.notice p{margin:0;flex:1}
.notice .link-btn{color:var(--sun-ink);font-weight:600;white-space:nowrap;text-decoration:none}
.notice .x{color:var(--ink-3);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:none}
.notice .x svg{width:16px;height:16px}

/* Type and common bits */
.hero{padding:6px 0 8px}
.glass{display:block;width:150px;height:auto;margin:4px auto 12px;overflow:visible}
.glass .pour{animation:slosh 5s ease-in-out infinite alternate}
.glass .ice rect{fill:#fff;fill-opacity:.14;stroke:var(--ice);stroke-opacity:.88;stroke-width:2.6}
.glass .ice .glint{fill:none;stroke:var(--ice);stroke-opacity:.7;stroke-width:1.6;stroke-linecap:round}
@keyframes slosh{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.state-line{margin:0;font-size:15px;color:var(--ink-2)}
.state-line strong{color:var(--ink);font-weight:500}
h1.title{margin:2px 0 0;font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.015em}
.edition{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.story{margin:12px 0 0;font-size:18px;font-weight:300;line-height:1.55;letter-spacing:.005em;color:var(--ink)}
.facts{margin:8px 0 0;font-size:14px;color:var(--ink-2)}
.empty-title{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.empty-body{margin:8px 0 0;color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.btn{height:44px;padding:0 18px;border-radius:22px;background:var(--raise-2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;position:relative;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--sun);color:var(--on-sun)}
.btn.small{height:38px;font-size:14px;padding:0 14px}
.btn:disabled{opacity:.55;cursor:default}
.btn.busy{color:transparent!important}
.btn.busy svg{visibility:hidden}
.btn.busy::after{content:"";position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;color:var(--ink)}
.btn.primary.busy::after{color:var(--on-sun)}
.link-btn{color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.link-btn.danger{color:var(--sun-ink)}
.section-title{margin:34px 0 4px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.section-note{margin:2px 0 0;font-size:13.5px;color:var(--ink-3)}
.foot{margin-top:36px;font-size:12.5px;color:var(--ink-3)}
.foot a{color:var(--ink-3)}
.spinner,.btn.busy::after{border-radius:50%;background:conic-gradient(from 90deg,transparent 10%,currentColor 95%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.2px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2.2px),#000 calc(100% - 2px));animation:spin .8s linear infinite}
.spinner{display:inline-block;width:14px;height:14px;vertical-align:-2px;color:var(--ink-2)}
@keyframes spin{to{transform:rotate(1turn)}}

/* Segmented switch and chips */
.switcher{display:inline-flex;padding:3px;border-radius:22px;background:var(--raise);margin:14px 0 0}
.switcher button{height:38px;min-width:64px;padding:0 16px;border-radius:19px;font-size:14px;font-weight:500;color:var(--ink-2)}
.switcher button[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.switcher.quiet button[aria-pressed="true"]{background:var(--raise-2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px;overscroll-behavior-x:contain}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--raise-2);font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.chip small{font-weight:400;opacity:.75;margin-left:4px}

/* Lists */
.rows{margin:6px 0 0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid var(--line)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 0;text-align:left;text-decoration:none}
.row-text{min-width:0;flex:1}
.row-title{display:block;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row-sub{display:block;font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{flex:none;min-width:3.4rem;font-size:15px;font-weight:500;color:var(--ink-2)}
.row-score{flex:none;font-size:22px;font-weight:600;letter-spacing:-.01em;min-width:2.6rem;text-align:right}
.rank{flex:none;width:1.4rem;text-align:center;font-size:14px;color:var(--ink-3);font-weight:500}
.thumb{flex:none;width:44px;height:44px;border-radius:12px;background:radial-gradient(circle at 50% 30%,var(--dome-out),var(--dome-in));overflow:hidden;display:grid;place-items:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .lab{font-weight:600;font-size:17px;color:var(--sun-ink)}
.thumb svg{width:26px;height:34px}

/* Drift card */
.drift-bar{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.drift-bar .chips{flex:1;margin-right:0;padding-right:16px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.drift-bar .icon-btn{margin-right:-10px}
.drift-count{margin:6px 0 0;font-size:13px;color:var(--ink-3)}
.card{touch-action:pan-y;will-change:transform;margin-top:10px}
.pic{position:relative;width:100%;aspect-ratio:1/1;max-height:36vh;border-radius:22px;overflow:hidden;
  background:radial-gradient(circle at 50% 38%,var(--dome-out),var(--dome-in) 78%);display:grid;place-items:center}
.pic img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;opacity:0;transition:opacity .25s}
.pic img.on{opacity:1}
.pic img.wide{inset:0;width:100%;height:100%;object-fit:cover}
.pic .drawn{width:34%;height:auto;color:var(--sun-ink);opacity:.85}
.pic .finding{position:absolute;left:12px;bottom:10px;font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.credit{margin:6px 2px 0;font-size:12px;color:var(--ink-3);min-height:1.2em}
.card-actions{display:flex;justify-content:space-between;margin-top:16px}
.act{display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--ink-2);min-width:64px;text-decoration:none}
.act .disc{width:48px;height:48px;border-radius:50%;background:var(--raise-2);display:grid;place-items:center}
.act .disc svg{width:22px;height:22px}
.act.accent .disc{background:var(--sun);color:var(--on-sun)}
.act[aria-pressed="true"] .disc{background:var(--sun-soft);color:var(--sun-ink)}
.act[aria-pressed="true"] .disc svg{fill:currentColor}
.hint{margin:12px 0 0;text-align:center;font-size:13px;color:var(--ink-3)}

/* Tasting */
.dram{margin:16px 0 0;padding:16px;border-radius:20px;background:var(--raise)}
.dram-head{display:flex;gap:12px;align-items:center}
.dram-head .thumb{width:52px;height:52px}
.dram-title{font-weight:600;font-size:17px;line-height:1.25}
.dram-sub{font-size:13.5px;color:var(--ink-2)}
.score-row{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
.score-big{font-size:34px;font-weight:600;letter-spacing:-.02em;min-width:3.2rem;text-align:center}
.score-big.unset{color:var(--ink-3)}
.round{width:44px;height:44px;border-radius:50%;background:var(--raise-2);display:grid;place-items:center;flex:none;font-size:22px;font-weight:500;line-height:1}
input[type=range]{flex:1;min-width:0;height:44px;background:transparent;-webkit-appearance:none;appearance:none;accent-color:var(--sun-ink)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--raise-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--sun);margin-top:-10px;border:0}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--raise-2)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--sun);border:0}
.dram .chips{margin-top:10px}
.dram .chip{height:34px;font-size:13.5px;padding:0 12px}
.dram textarea{margin-top:10px}
.dram-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.saved{font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tick{width:20px;height:20px;border-radius:50%;background:var(--raise-2);display:grid;place-items:center;color:var(--ink)}
.tick svg{width:12px;height:12px}
.reveal-box{margin:22px 0 0;padding:18px 16px;border-radius:20px;border:1px dashed var(--line-2);text-align:center}
.reveal-box p{margin:0 0 12px;color:var(--ink-2);font-size:15px}
.winner{margin:6px 0 0;text-align:center}
.winner .big{font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:13px;padding:5px 10px;border-radius:14px;background:var(--raise-2);color:var(--ink-2)}
.pill b{color:var(--ink);font-weight:600}
.notes{margin:10px 0 0;padding:0;list-style:none}
.notes li{font-size:14.5px;color:var(--ink-2);margin:6px 0 0}
.notes li b{color:var(--ink);font-weight:500}

/* Full-screen layer (tasting, results) */
.screen{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:pan-y}
.screen[hidden]{display:none}
.screen .wrap{padding-bottom:48px}
.screen-head{display:flex;align-items:center;gap:4px;padding:10px 0 4px;margin-left:-10px}
.screen-head .t{font-weight:600;font-size:17px}
.screen-head .s{font-size:13px;color:var(--ink-3)}
.back-arrow{position:fixed;left:10px;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:var(--raise-2);display:grid;place-items:center;color:var(--ink);opacity:0;pointer-events:none;z-index:40}
.back-arrow svg{width:22px;height:22px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom)}
.tabs[hidden]{display:none}
.tabs-in{max-width:34rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{height:62px;display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--ink-3)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--sun-ink)}

/* Media */
.media-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 4px}
.media-head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:10px}
.vcard{display:block;text-align:left;min-width:0}
.vthumb{position:relative;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--raise-2)}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .lock{position:absolute;left:6px;top:6px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.66);color:#fff}
.vthumb .playg{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
.vthumb .playg svg{width:14px;height:14px}
.vtitle{display:block;margin-top:6px;font-size:14px;font-weight:500;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vdate{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px -4px 0}
.igrid button{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--raise-2);border-radius:4px}
.igrid img{width:100%;height:100%;object-fit:cover;display:block}
.igrid .reel{position:absolute;right:6px;top:6px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.igrid .reel svg{width:16px;height:16px}
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-top:10px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.nowplaying{margin:16px 0 0;padding:18px 16px 14px;border-radius:22px;background:radial-gradient(120% 120% at 50% 0%,var(--dome-out),var(--raise) 70%);text-align:center}
.nowplaying .art{width:96px;height:96px;margin:0 auto 6px;display:block;filter:drop-shadow(0 8px 24px rgba(255,120,20,.3))}
.nowplaying.playing .art{animation:breathe 2.4s ease-in-out infinite alternate}
.np-title{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.np-artist{font-size:14px;color:var(--ink-2);margin-top:2px}
.np-bar{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--ink-3)}
.np-bar input{flex:1;height:30px}
.np-controls{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:6px}
.np-controls .round svg,.mini .round svg{width:20px;height:20px}
.round.big{width:60px;height:60px}
.round.big svg{width:26px;height:26px}
.round.accent{background:var(--sun);color:var(--on-sun)}
.track{display:flex;align-items:center;gap:12px;min-height:58px;border-bottom:1px solid var(--line)}
.track .row-main{gap:14px}
.tnum{flex:none;width:22px;text-align:center;font-size:14px;color:var(--ink-3)}
.track.on .row-title{color:var(--sun-ink)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;width:22px;justify-content:center}
.eq i{display:block;width:3px;background:var(--sun);border-radius:1px;animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(1){height:60%}.eq i:nth-child(2){height:100%;animation-delay:-.4s}.eq i:nth-child(3){height:40%;animation-delay:-.7s}
.eq.still i{animation:none}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.eq i{transform-origin:bottom}
.mini{position:fixed;left:0;right:0;bottom:calc(63px + env(safe-area-inset-bottom));z-index:7;padding:0 12px 8px;pointer-events:none}
.mini[hidden]{display:none}
.mini-in{pointer-events:auto;max-width:34rem;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:18px;background:var(--raise-2);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.mini-in img{width:34px;height:34px;flex:none}
.mini-text{flex:1;min-width:0;text-align:left}
.mini-text b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-text span{display:block;font-size:12.5px;color:var(--ink-3)}
.mini-prog{height:2px;border-radius:1px;background:var(--line-2);margin-top:4px;overflow:hidden}
.mini-prog i{display:block;height:100%;width:0;background:var(--sun)}
body.has-mini .wrap{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
details.how{margin-top:10px;color:var(--ink-2);font-size:14.5px}
details.how summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 14px;border-radius:19px;background:var(--raise-2);color:var(--ink);font-weight:600;font-size:14px;-webkit-tap-highlight-color:transparent;transition:background .15s}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:'';width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s;opacity:.8}
details.how[open] summary::after{transform:translateY(1px) rotate(-135deg)}
details.how summary:active{background:var(--line)}
details.how[open] summary{margin-bottom:6px}
details.how ol{margin:6px 0 0;padding-left:20px}
details.how li{margin:4px 0}
.admin-card{margin-top:10px;padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.admin-card p{margin:0 0 10px}

/* Sheets */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:34rem;max-height:90vh;border:0;border-radius:22px 22px 0 0;padding:0;background:var(--raise);color:var(--ink);overflow:auto;overscroll-behavior:contain}
dialog.sheet[open]{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
dialog.sheet::backdrop{background:rgba(4,4,2,.64)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.sheet-in{padding:10px 22px calc(28px + env(safe-area-inset-bottom))}
.grab{padding:4px 0 10px;margin:0 -22px;touch-action:none;cursor:grab}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;touch-action:none}
.sheet-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.sheet-head .lead{display:flex;align-items:center;gap:2px;margin-left:-10px}
.sheet h3{margin:24px 0 8px;font-size:15px;font-weight:600}
.sheet p{margin:6px 0;color:var(--ink-2);font-size:15px}
.sheet .small{font-size:13.5px;color:var(--ink-3)}
.result{margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.result:empty{display:none}
label.lbl{display:block;margin:16px 0 6px;font-size:13.5px;color:var(--ink-2)}
.field{width:100%;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);padding:0 12px;font-size:16px}
textarea.field{height:auto;min-height:72px;padding:10px 12px;resize:vertical;line-height:1.4}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.field::placeholder{color:var(--ink-3)}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.toggle-row p{margin:0}
.switch{width:50px;height:30px;border-radius:15px;background:var(--raise-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink-2);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--sun)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-sun)}
.steps{list-style:none;counter-reset:s;padding:0;margin:18px 0 0}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 40px;color:var(--ink-2);font-size:15px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:var(--raise-2);color:var(--ink);font-size:13px;font-weight:600;display:grid;place-items:center}
.steps li strong{display:block;color:var(--ink);font-weight:600;margin-bottom:6px}
.code{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px;word-break:break-all;user-select:all}
.mini{color:var(--ink-2);font-size:14px;font-weight:600;padding:10px 4px;min-height:44px}
.sheet .rows .row{min-height:56px}
.sheet .pic{max-height:36vh;margin-top:4px}
.lineup-edit .row{gap:6px}
.lineup-edit select{height:36px;font-size:14px;width:auto;max-width:9.5rem;border-radius:10px;padding:0 28px 0 10px;background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px}


/* Gate */
.gate{padding:3vh 0 0;text-align:center}
.gate .logo{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 40px var(--glow))}
.gate h1{margin:6px 0 0;font-size:26px;font-weight:600;letter-spacing:-.015em}
.gate p{color:var(--ink-2);margin:10px auto 0;max-width:22rem}
.gate form{margin:24px auto 0;max-width:20rem;display:grid;gap:10px}
.gate #pinIn{text-align:center;font-size:22px;letter-spacing:.2em;height:54px}
.gate #pinIn::placeholder{letter-spacing:.05em;font-size:17px}
.gate .err{color:var(--sun-ink);font-size:14.5px;min-height:1.4em;margin:8px 0 0}
.who{margin:18px auto 0;max-width:22rem;text-align:left}

/* Toast */
.toast{position:fixed;inset:auto auto calc(84px + env(safe-area-inset-bottom)) 50%;margin:0;border:0;width:max-content;max-width:calc(100% - 40px);
  transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;font-weight:500;
  transition:opacity .2s,transform .2s;text-align:center;z-index:60;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .spinner{color:var(--bg)}
.toast:popover-open{display:flex}

.loading-mark{display:block;width:72px;height:72px;margin:28px auto 10px;animation:breathe 1.8s ease-in-out infinite alternate}
.dram,.nowplaying,.admin-card,.notice{box-shadow:var(--shadow)}
.logo-stage{display:block;width:min(70vw,290px);margin:0 auto;border-radius:30px}
:root[data-theme="light"] .gate .logo-stage{margin-bottom:20px}
:root[data-theme="light"] .logo-stage{padding:16px 18px 18px;background:radial-gradient(120% 90% at 50% 38%,#2C1809,#0D0904 70%);box-shadow:0 18px 40px rgba(60,30,5,.28)}
:root[data-theme="light"] .brand img,:root[data-theme="light"] .loading-mark,:root[data-theme="light"] .nowplaying .art,:root[data-theme="light"] .mini-in img{filter:drop-shadow(0 1px 1.5px rgba(60,30,5,.55))}
:root[data-theme="light"] .mini-in{box-shadow:0 10px 30px rgba(74,44,14,.18)}
:root[data-theme="light"] dialog.sheet::backdrop{background:rgba(40,24,8,.42)}
:root[data-theme="light"] .tabs{background:color-mix(in srgb,var(--bg) 88%,transparent)}
@keyframes breathe{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .spinner,.btn.busy::after{animation:spin 1.6s linear infinite!important}
}
</style>

      <g class="ice"><rect x="50" y="${ice - 10}" width="24" height="24" rx="5.5" transform="rotate(45 62 ${ice + 2})"/><path class="glint" d="M56 ${ice - 2}l5-5"/>
        <rect x="76" y="${ice - 4}" width="24" height="24" rx="5.5"/><path class="glint" d="M92 ${ice - 1}q4 1 5 6"/></g></g>

/* ---------- Toast (above open sheets) ---------- */
let toastTimer;
function toast(msg, busy) {
  const t = $('#toast');
  t.innerHTML = (busy ? '<span class="spinner" aria-hidden="true"></span>' : '') + `<span>${esc(msg)}</span>`;
  try { if (t.matches(':popover-open')) t.hidePopover(); t.showPopover(); } catch {}
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (!busy) toastTimer = setTimeout(() => { t.classList.remove('show'); setTimeout(() => { try { if (!t.classList.contains('show')) t.hidePopover(); } catch {} }, 250); }, Math.max(2600, msg.length * 55));
}
const busyToast = (msg) => { toast(msg, true); toastTimer = setTimeout(endBusy, 60000); };   // never left on screen for good
function endBusy() {   // clear a "working…" message that nothing replaced
  const t = $('#toast');
  if (!t.querySelector('.spinner')) return;
  clearTimeout(toastTimer); t.classList.remove('show');
  setTimeout(() => { try { if (!t.classList.contains('show')) t.hidePopover(); } catch {} }, 250);
}
async function withBusy(btn, fn) {
  if (btn && btn.disabled) return;
  if (btn) { btn.disabled = true; btn.classList.add('busy'); btn.setAttribute('aria-busy', 'true'); }
  try { return await fn(); } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.classList.remove('busy'); btn.removeAttribute('aria-busy'); } }
}

const friendly = (err) => (err && err.name === 'TypeError' ? 'Couldn’t reach the club. Check your connection and try again.' : String((err && err.message) || err));
async function api(action, data = {}) {

  let j;
  try { j = await r.json(); } catch { throw new Error('The club’s Apps Script sent back something unexpected. Try again in a minute.'); }
  if (j.error) { const e = new Error(j.error); e.server = true; throw e; }

}
function setData(j) {
  if (!j || !j.members) return;

  if (j.dev && j.me && S.me !== j.me) { S.me = j.me; put('me', S.me); }   // the developer's PIN: the hidden member
  if (j.adminStale) { S.admin = ''; del('admin'); }   // admin has moved to someone else

    catch (err) {

      S.syncFail = true;

}

/* ---------- Catalogue ---------- */
let catPromise = null;
function loadCatalogue() {
  if (S.cat) return Promise.resolve(S.cat);
  if (catPromise) return catPromise;
  S.catLoading = true;
  catPromise = new Promise((resolve) => {
    const done = (list, err) => {
      S.catLoading = false;
      if (list) { S.cat = list; S.byId = new Map(list.map((w) => [w.id, w])); S.catErr = ''; }
      else { S.catErr = err || 'Couldn’t load the whisky list.'; catPromise = null; }
      resolve(S.cat);
      onCatalogue();
    };
    const mainThread = async () => {
      try { const r = await fetch('whiskies.csv', { cache: 'no-cache' }); if (!r.ok) throw 0; done(C.catalogue(await r.text())); }
      catch { done(null, 'Couldn’t load the whisky list. Check your connection and try again.'); }
    };
    try {
      const w = new Worker('catalogue-worker.js' + V);
      w.onmessage = (e) => { w.terminate(); if (e.data.ok) done(e.data.list); else mainThread(); };
      w.onerror = (e) => { e.preventDefault(); w.terminate(); mainThread(); };
      w.postMessage(1);
    } catch { mainThread(); }
  });
  return catPromise;
}
function onCatalogue() {
  lineupPictures();
  if (S.me && S.data) $('#clubLine').textContent = sectionLine();
  if (S.tab === 'drift' && !S.screen) { ensureDrift(); renderMain(); }
  const pick = $('#pickList'); if (pick) renderPick();
}
function filtered() {
  const t = S.set.type;
  return !S.cat ? [] : t === 'All' ? S.cat : S.cat.filter((w) => w.typeLabel === t);
}
function buildDeck() {
  S.deck = C.shuffle(filtered().map((w) => w.id));
  S.pos = 0;
}
function ensureDrift() {
  if (!S.cat) return;
  const f = filtered();
  const cur = S.cur && S.byId.get(S.cur);
  if (!S.deck.length) buildDeck();
  if (!cur || (S.set.type !== 'All' && cur.typeLabel !== S.set.type)) { S.cur = S.deck[S.pos] || (f[0] && f[0].id) || null; put('drift', S.cur); }
}
function nextDram(dir) {
  if (!S.cat) return;
  if (dir < 0) {
    if (!S.hist.length) { toast('That’s the first one this time'); return false; }
    S.cur = S.hist.pop();
  } else {
    if (S.cur) S.hist.push(S.cur);
    if (S.hist.length > 60) S.hist.shift();
    S.pos++;
    if (S.pos >= S.deck.length) buildDeck();
    if (S.deck[S.pos] === S.cur && S.deck.length > 1) S.pos = (S.pos + 1) % S.deck.length;
    S.cur = S.deck[S.pos];
  }
  put('drift', S.cur);
  return true;
}
const upcomingId = () => S.deck[(S.pos + 1) % Math.max(1, S.deck.length)];

/* ---------- Pictures: the catalogue's own, else a search ---------- */
// Cached per whisky: { u, src, kind: 'bottle'|'distillery', at } or { none: 1, at }
function saveImgs() {
  const ks = Object.keys(S.imgs);
  if (ks.length > 1500) ks.sort((a, b) => S.imgs[a].at - S.imgs[b].at).slice(0, ks.length - 1500).forEach((k) => delete S.imgs[k]);
  put('imgs', S.imgs);
}
function picFor(w) {
  const c = S.imgs[w.id];
  if (c && c.u) return c;
  if (w.image && !(c && c.bad === w.image)) return { u: w.image, src: host(w.image), kind: 'bottle', own: true };
  if (c && c.none && Date.now() - c.at < 14 * DAY) return null;
  return undefined;   // not known yet: search
}
async function getJSON(url, ms = 7000) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
const fileText = (title) => title.replace(/^File:/, '').replace(/\.[a-z0-9]{3,4}$/i, '').replace(/[_-]+/g, ' ');
const stillWanted = (w) => S.cur === w.id && S.tab === 'drift';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Returns a picture, null for none anywhere, or 'later' when the search was left unfinished
async function searchPicture(w, force) {
  const q = C.imageQuery(w);
  let failed = false;   // a lookup that couldn't be made is not the same as "no picture"
  // 1. Wikimedia Commons: photos people have uploaded of the bottle
  try {
    const j = await getJSON(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch=${encodeURIComponent(q + ' bottle')}&prop=imageinfo&iiprop=url|mime&iiurlwidth=640`);
    const pages = Object.values((j.query && j.query.pages) || {});
    const cands = pages.filter((p) => p.imageinfo && /^image\/(jpeg|png|webp)$/.test(p.imageinfo[0].mime)).map((p) => ({ text: fileText(p.title), url: p.imageinfo[0].thumburl || p.imageinfo[0].url }));
    const b = C.bestMatch(w, cands);
    if (b) return { u: b.url, src: 'Wikimedia Commons', kind: 'bottle' };
  } catch { failed = true; }
  // 2. Open Food Facts: shop-shelf bottle photos. Its search allows about 10 a minute, so wait for a slot,
  //    but only while this whisky is still on screen
  const wait = S.offAt + 7000 - Date.now();
  if (wait > 0) { await sleep(wait); if (!force && !stillWanted(w)) return 'later'; }
  S.offAt = Date.now();
  try {
    const j = await getJSON(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&json=1&page_size=12&fields=product_name,brands,image_front_url`);
    const cands = (j.products || []).filter((p) => p.image_front_url).map((p) => ({ text: `${p.brands || ''} ${p.product_name || ''}`, url: p.image_front_url }));
    const b = C.bestMatch(w, cands);
    if (b) return { u: C.httpsUrl(b.url), src: 'Open Food Facts', kind: 'bottle' };
  } catch { failed = true; }
  // 3. The distillery's picture on Wikipedia, labelled as such
  const dname = C.shortDistillery(w.distillery);
  if (dname) {
    try {
      const j = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&gsrsearch=${encodeURIComponent(dname + ' distillery whisky')}&prop=pageimages&piprop=thumbnail&pithumbsize=640`);
      const pages = Object.values((j.query && j.query.pages) || {}).sort((a, b) => (a.index || 0) - (b.index || 0));
      const dw = C.words(dname).filter((x) => x.length > 2);
      const p = pages.find((x) => x.thumbnail && dw.every((t) => C.words(x.title).includes(t)));
      if (p) return { u: p.thumbnail.source, src: 'Wikipedia', kind: 'distillery', page: p.title };
    } catch { failed = true; }
  }
  return failed ? 'later' : null;
}
async function findPicture(w, force) {
  if (S.finding.has(w.id)) return;
  S.finding.add(w.id);
  let r = null;
  try { r = await searchPicture(w, force); } catch { r = 'later'; }
  S.finding.delete(w.id);
  if (r === 'later') { if (S.cur === w.id) { const box = $('#pic'), cr = $('#credit'); if (box && box.dataset.id === w.id) { box.innerHTML = bottleSvg(); if (cr) cr.textContent = navigator.onLine ? 'Couldn’t look for a picture just now.' : 'Offline, so no picture search.'; } } return; }   // unfinished or unreachable: try again next time it shows
  const prev = S.imgs[w.id] || {};
  S.imgs[w.id] = r ? Object.assign(r, { at: Date.now() }) : { none: 1, at: Date.now(), bad: prev.bad };
  saveImgs();
  if (S.cur === w.id) paintPic(w);
  if (r && r.kind === 'bottle') {
    if (S.edit) S.edit.lineup.forEach((d) => { if (d.whiskyId === w.id && !d.snap.image) d.snap.image = r.u; });
    shareFound(w, r.u);
  }
}
// Line-ups and the wish list keep a picture for everyone: the first phone to find one fills it in
const shared = new Set();
function shareFound(w, url) {
  const jobs = [];
  for (const m of D().meets) if (!m.revealed) for (const d of m.lineup || []) if (!d.hidden && d.whiskyId === w.id && !d.snap.image) jobs.push({ kind: 'dram', meetId: m.id, dramId: d.id });
  for (const x of D().wishes) if (x.whiskyId === w.id && !x.snap.image) jobs.push({ kind: 'wish', wishId: x.id });
  jobs.forEach((j) => {
    const k = JSON.stringify(j);
    if (shared.has(k)) return;
    shared.add(k);
    api('fillImage', Object.assign(j, { image: url })).then((st) => { setData(st); if (!S.screen && !sheet.open) renderMain(); }).catch(() => {});
  });
}
function lineupPictures() {
  if (!S.cat || !S.data) return;
  const m = currentMeet();
  const items = (m ? m.lineup : []).map((d) => d).concat(D().wishes);
  for (const d of items) {
    const w = d.whiskyId && !d.hidden && !d.snap.image && S.byId.get(d.whiskyId);
    if (!w) continue;
    const p = picFor(w);
    if (p === undefined) findPicture(w, true);
    else if (p && p.kind === 'bottle') shareFound(w, p.u);
  }
}
function creditFor(p) {
  if (!p) return '';
  if (p.kind === 'distillery') return 'A picture of the distillery from Wikipedia, not this bottle.';
  return `Picture: ${p.src}`;
}
function paintPic(w) {
  const box = $('#pic');
  if (!box || box.dataset.id !== w.id) return;
  const p = picFor(w);
  const cr = $('#credit');
  if (p === undefined) {
    box.innerHTML = bottleSvg() + '<span class="finding"><span class="spinner" aria-hidden="true"></span>Looking for a picture…</span>';
    if (cr) cr.textContent = '';
    findPicture(w);
    return;
  }
  if (!p) { box.innerHTML = bottleSvg(); if (cr) cr.textContent = 'No picture found for this one.'; return; }
  box.innerHTML = bottleSvg() + `<img alt="${esc(p.kind === 'distillery' ? `${w.distillery} distillery` : w.title)}" referrerpolicy="no-referrer" decoding="async"${p.kind === 'distillery' ? ' class="wide"' : ''}>`;
  const img = box.querySelector('img');
  img.onload = () => { img.classList.add('on'); const d = box.querySelector('.drawn'); if (d) d.style.visibility = 'hidden'; };
  img.onerror = () => {
    // the shop or site won't share its picture: search instead, once
    if (p.own) { S.imgs[w.id] = { bad: w.image, at: Date.now() }; saveImgs(); paintPic(w); }
    else if (!navigator.onLine) { box.innerHTML = bottleSvg(); if (cr) cr.textContent = 'Offline, so no picture.'; }
    else { S.imgs[w.id] = { none: 1, at: Date.now() }; saveImgs(); box.innerHTML = bottleSvg(); if (cr) cr.textContent = 'No picture found for this one.'; }
  };
  img.src = p.u;
  if (cr) cr.textContent = creditFor(p);
}
// The picture to keep with a line-up or wish-list entry
function keepPic(w) { const p = picFor(w); return p && p.kind === 'bottle' ? p.u : ''; }
// Warm up the next card's picture when the catalogue has one; searches wait until a card is on screen
function prefetchNext() {

function thumbHtml(snap, label) {

function renderMain() {

/* ---------- Meet ---------- */
function rsvpLine(m) {
  const by = { in: [], maybe: [], out: [], none: [] };
  D().members.forEach((x) => { by[rsvpOf(m.id, x.id) || 'none'].push(x.id === S.me ? 'you' : x.name); });
  const parts = [];
  if (by.in.length) parts.push(`In: ${list(by.in)}.`);
  if (by.maybe.length) parts.push(`Maybe: ${list(by.maybe)}.`);
  if (by.out.length) parts.push(`Can’t come: ${list(by.out)}.`);
  if (by.none.length) parts.push(`Not replied: ${list(by.none)}.`);
  return { n: by.in.length, text: parts.join(' ') };
}
function whenLine(m) {
  const now = Date.now(), dw = dayWord(m.at);
  if (m.at <= now) return `<strong>Under way</strong>, since ${time(m.at)}`;
  if (dw === 'Today' || dw === 'Tonight') return `<strong>${dw}</strong> at ${time(m.at)}, ${esc(until(m.at))}`;
  if (dw === 'Tomorrow') return `<strong>Tomorrow</strong> at ${time(m.at)}`;
  return `<strong>${esc(until(m.at).replace(/^in/, 'In'))}</strong>, at ${time(m.at)}`;
}
function meetStory(m) {
  const hostName = m.host === S.me ? 'You’re' : m.host ? `${memberName(m.host)} is` : '';
  let s = hostName ? `${hostName} hosting${m.place ? `, at ${m.place}` : ''}.` : m.place ? `At ${m.place}.` : 'No host or place yet.';
  const n = (m.lineup || []).length;
  s += n ? ` ${plural(n, 'dram')} on the line-up${m.blind ? ', tasted blind' : ''}.` : ' No drams on the line-up yet.';
  return s;
}
function lineupRows(m) {
  return `<ul class="rows">${(m.lineup || []).map((d) => {
    const by = d.by ? (d.by === S.me ? 'you' : memberName(d.by)) : '';
    const sub = d.hidden ? 'Hidden until the reveal' : [d.snap.sub, by && `brought by ${by}`].filter(Boolean).join(', ');
    return `<li class="row"><button class="row-main" type="button" data-dram="${esc(m.id)}:${esc(d.id)}">${thumbHtml(d.hidden ? null : d.snap, d.hidden ? d.label : '')}
      <span class="row-text"><span class="row-title">${esc(d.snap.title)}</span><span class="row-sub">${esc(sub)}</span></span></button></li>`;
  }).join('')}</ul>`;
}
function meetHtml() {
  const m = currentMeet();
  let html;
  if (!m) {
    html = `<section class="hero">${glassSvg(0, 'An empty glass: no meet planned')}
      <h1 class="empty-title">No meet planned yet</h1>
      <p class="empty-body">Pick a date, a host and a few drams, and Dram tells the club.</p>
      <div class="actions"><button class="btn primary" type="button" data-act="new-meet">${ICON.plus}Plan the next meet</button></div></section>`;
  } else {
    const r = rsvpLine(m), mine = rsvpOf(m.id, S.me);
    const now = Date.now(), head = longDate(m.at);
    const state = whenLine(m);
    const links = [m.slides && `<a class="btn small" ${extLink(m.slides)}>${ICON.slides}Slides</a>`, m.video && `<a class="btn small" ${extLink(m.video)}>${ICON.play}Song or video</a>`].filter(Boolean).join('');
    const pct = Math.round(C.fill(m.at, now) * 100);
    html = `<section class="hero">${glassSvg(C.fill(m.at, now), `A glass ${pct}% full: the meet is ${until(m.at)}`)}
      <p class="state-line num">${state}</p>
      <h1 class="title">${esc(head)}</h1>
      <p class="story">${esc(meetStory(m))}</p>
      <p class="facts">${devTest(m) ? '<b>Test meet: only you can see it.</b> ' : ''}${esc(`${r.n} of ${D().members.length} ${r.n === 1 ? 'is' : 'are'} in.`)} ${m.notes ? esc(m.notes) : ''}</p>
      <div class="switcher" role="group" aria-label="Are you coming?">${[['in', 'I’m in'], ['maybe', 'Maybe'], ['out', 'Can’t']].map(([v, l]) => `<button type="button" data-rsvp="${v}" data-meet="${esc(m.id)}" aria-pressed="${mine === v}">${l}</button>`).join('')}</div>
      <div class="actions">${tastingOpen(m) ? `<button class="btn primary" type="button" data-act="tasting" data-meet="${esc(m.id)}">Start tasting</button>` : ''}
        ${amDev() && !devTest(m) ? '' : `<button class="btn" type="button" data-act="edit-meet" data-meet="${esc(m.id)}">${ICON.pencil}Edit meet</button>`}${links}</div>
    </section>
    <h2 class="section-title">Line-up</h2>
    ${(m.lineup || []).length ? lineupRows(m) : `<p class="section-note">Nothing yet. Tap Edit meet to add drams from the catalogue or the wish list.</p>`}
    <h2 class="section-title">Who’s coming</h2><p class="section-note" style="font-size:14.5px;color:var(--ink-2)">${esc(r.text)}</p>`;
  }
  const past = pastMeets().slice(0, 12);
  if (past.length) {
    html += `<h2 class="section-title">Past meets</h2><ul class="rows">${past.map((p) => {
      const top = p.revealed ? C.rankDrams(p.lineup || [], scoresFor(p.id))[0] : null;
      const sub = p.revealed ? (top && top.avg != null ? `Top: ${top.dram.snap.title}, ${top.avg.toFixed(1)}` : 'No scores') : 'Scores not revealed yet';
      return `<li class="row"><button class="row-main" type="button" data-act="${p.revealed ? 'results' : 'tasting'}" data-meet="${esc(p.id)}"><span class="row-time num">${esc(shortDate(p.at).replace(/^\w+ /, ''))}</span>
        <span class="row-text"><span class="row-title">${esc(p.place ? `At ${p.place}` : longDate(p.at))}</span><span class="row-sub">${esc(sub)}</span></span></button></li>`;
    }).join('')}</ul>`;
  }
  if (m) html += `<div class="actions" style="margin-top:28px"><button class="link-btn" type="button" data-act="new-meet">Plan another meet</button></div>`;
  return html;
}

/* ---------- Meet editor ---------- */
function toLocalInputs(ms) {
  const d = new Date(ms), p = (n) => String(n).padStart(2, '0');
  return { date: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`, time: `${p(d.getHours())}:${p(d.getMinutes())}` };
}
function openEditor(m) {
  if (m) S.edit = JSON.parse(JSON.stringify({ id: m.id, at: m.at, host: m.host, place: m.place, notes: m.notes, slides: m.slides, video: m.video, blind: m.blind, lineup: m.lineup, revealed: m.revealed, tell: true, hiddenLineup: (m.lineup || []).some((d) => d.hidden) }));
  else {
    const d = new Date(); d.setDate(d.getDate() + 14); d.setHours(19, 30, 0, 0);
    S.edit = { id: '', at: d.getTime(), host: S.me, place: '', notes: '', slides: '', video: '', blind: false, lineup: [], tell: true };

function readEditor() {

  e.host = f('edHost'); e.place = f('edPlace'); e.notes = f('edNotes'); e.slides = f('edSlides').trim(); e.video = f('edVideo').trim();

      ${locked || d.hidden ? '' : `<select class="field" data-by="${esc(d.id)}" aria-label="Who brings it">${opts(d.by, 'Brought by…')}</select>`}</span></span>

    <div class="toggle-row"><p>Blind tasting<br><span class="small">Everyone sees Dram A, B, C until the reveal</span></p><button class="switch" type="button" role="switch" data-act="ed-blind" aria-checked="${!!e.blind}" aria-label="Blind tasting"></button></div>`}

function openPick() {

function renderPick() {

/* ---------- Dram detail sheet (from a line-up, the cabinet or the wish list) ---------- */
function openDram(meetId, dramId) {
  const m = meetById(meetId), d = m && (m.lineup || []).find((x) => x.id === dramId);
  if (!d) return;
  if (d.hidden) { openSheet(`${head(`Dram ${esc(d.label)}`)}<p>This is a blind tasting. The bottle stays hidden until the scores are revealed.</p>`); return; }
  const w = d.whiskyId && S.byId.get(d.whiskyId);
  const sc = m.revealed ? scoresFor(m.id).filter((s) => s.dramId === d.id) : [];
  const st = C.summarise(sc);
  openSheet(`${head(esc(d.snap.title))}
    ${d.snap.edition ? `<p class="edition">${esc(d.snap.edition)}</p>` : ''}
    ${d.snap.image ? `<div class="pic"><img class="on" src="${esc(d.snap.image)}" alt="${esc(d.snap.title)}" referrerpolicy="no-referrer"></div>` : ''}
    <p class="story" style="font-size:16px">${esc(w ? C.story(w) : d.snap.sub || 'Not in the catalogue.')}</p>
    ${m.revealed && st.n ? `<h3>The club’s verdict: ${st.avg.toFixed(1)}</h3>${verdictHtml(sc)}` : ''}
    ${shopRow(d.snap, w)}`);
  if (!S.cat && d.whiskyId) loadCatalogue().then(() => { if ($('#sheet').open && $('#sheetTitle') && $('#sheetTitle').textContent === d.snap.title) openDram(meetId, dramId); });
}
function shopRow(snap, w) {
  const q = snap.q || C.shopQuery(snap.title, w);
  const info = snap.info || (w && w.info);
  return `<div class="card-actions" style="justify-content:flex-start;gap:18px">
    <a class="act" ${extLink(C.shoppingUrl(q))} aria-label="Search Google Shopping for ${esc(snap.title)}" title="Search Google Shopping"><span class="disc">${ICON.bag}</span>Shop</a>
    ${info ? `<a class="act" ${extLink(info)} aria-label="Read more about ${esc(snap.title)}" title="Read more"><span class="disc">${ICON.info}</span>Read</a>` : ''}</div>`;
}
function verdictHtml(sc) {
  const people = sc.slice().sort((a, b) => b.score - a.score).map((s) => `<span class="pill"><b class="num">${s.score.toFixed(1)}</b> ${esc(s.memberId === S.me ? 'you' : memberName(s.memberId) || 'Former member')}</span>`).join('');
  const tagCount = {};
  sc.forEach((s) => (s.tags || []).forEach((t) => { tagCount[t] = (tagCount[t] || 0) + 1; }));
  const tags = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([t, n]) => `${t}${n > 1 ? ` (${n})` : ''}`);
  const notes = sc.filter((s) => s.note).map((s) => `<li><b>${esc(s.memberId === S.me ? 'You' : memberName(s.memberId) || 'Former member')}:</b> ${esc(s.note)}</li>`).join('');
  return `<div class="people">${people}</div>${tags.length ? `<p class="small" style="margin-top:8px">Picked up: ${esc(tags.join(', '))}</p>` : ''}${notes ? `<ul class="notes">${notes}</ul>` : ''}`;
}

/* ---------- Tasting and results (full screen) ---------- */
function openScreen(kind, meetId) {
  S.screen = { kind, meetId };
  const el = $('#screen');
  el.hidden = false;
  document.body.style.overflow = 'hidden';
  renderScreen();
  el.scrollTop = 0;
  history.pushState({ screen: kind, meetId }, '');
  if (kind === 'tasting') startPolling();
  renderMini();
}
function closeScreen(silent) {
  if (!S.screen) return;
  S.screen = null;
  stopPolling();
  const el = $('#screen');
  el.hidden = true; el.style.transform = ''; el.innerHTML = ''; delete el.dataset.sig;
  document.body.style.overflow = '';
  if (!silent) renderAll();
  renderMini();
}
function goBack() {
  if (history.state && history.state.screen) {
    let done = false;
    const fin = () => { if (done) return; done = true; window.removeEventListener('popstate', fin); closeScreen(); };
    window.addEventListener('popstate', fin);
    history.back();
    setTimeout(fin, 400);
  } else closeScreen();
}
window.addEventListener('popstate', () => { if (S.screen && !(history.state && history.state.screen)) closeScreen(); });
function startPolling() { stopPolling(); S.polling = setInterval(() => { if (document.visibilityState === 'visible') refresh(true); }, 20000); }
function stopPolling() { clearInterval(S.polling); S.polling = 0; }

const draft = {};   // unsaved score edits, kept while the screen re-renders
function renderScreen() {
  const s = S.screen, el = $('#screen');
  if (!s) return;
  const m = meetById(s.meetId);
  if (!m) { el.innerHTML = `<div class="wrap">${screenHead('Meet', '')}<p class="empty-body">This meet has been deleted.</p></div>`; return; }
  const keepY = el.scrollTop;
  const active = document.activeElement && document.activeElement.id;
  el.innerHTML = `<div class="wrap">${m.revealed ? resultsHtml(m) : tastingHtml(m)}</div>`;
  el.dataset.sig = `${m.revealed}|${(m.lineup || []).map((d) => d.id + d.snap.title).join(',')}`;
  el.scrollTop = keepY;
  if (active && $('#' + active)) $('#' + active).focus();
}
// Background refreshes only touch the counts, so a slider or a note being typed is never interrupted
function updateScreen() {
  const s = S.screen, el = $('#screen'), m = s && meetById(s.meetId);
  const sig = m ? `${m.revealed}|${(m.lineup || []).map((d) => d.id + d.snap.title).join(',')}` : 'gone';
  if (!el.dataset.sig || el.dataset.sig !== sig) { renderScreen(); return; }
  if (m.revealed) { renderScreen(); return; }
  const c = $('#scorerCount');
  if (c) c.textContent = scorerText(m);
  el.querySelectorAll('.dram[data-k]').forEach((card) => {
    const dramId = card.dataset.k.split(':')[1], n = (m.scored || {})[dramId] || 0, d = m.lineup.find((x) => x.id === dramId);
    const sub = card.querySelector('.dram-sub');
    if (sub && d) sub.textContent = [d.hidden ? '' : d.snap.sub, plural(n, 'score')].filter(Boolean).join(', ');
  });
}
const scorerText = (m) => { const n = (m.scorers || []).length; return `${n} of ${D().members.length} ${n === 1 ? 'has' : 'have'} scored so far. Nobody sees anyone else’s scores until the reveal.`; };
function screenHead(t, sub) {
  return `<div class="screen-head"><button class="icon-btn" type="button" data-act="screen-back" aria-label="Back">${ICON.back}</button>
    <div><div class="t" id="screenTitle">${esc(t)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div></div>`;
}
function tastingHtml(m) {
  const lineup = m.lineup || [];
  const mine = lineup.filter((d) => myScore(m.id, d.id)).length;
  const done = lineup.length && mine === lineup.length;
  let html = screenHead('Tasting', `${longDate(m.at)}${m.place ? `, at ${m.place}` : ''}`);
  html += `<p class="state-line num" style="margin-top:8px"><strong>You’ve scored ${mine} of ${lineup.length}</strong>${done ? ' <span class="vh">all scored</span>' : ''}</p>
    <p class="section-note" id="scorerCount">${esc(scorerText(m))}</p>`;
  if (!lineup.length) html += `<p class="empty-body" style="margin-top:20px">There’s nothing on the line-up. Go back and tap Edit meet to add the drams.</p>`;
  html += lineup.map((d) => {
    const s = myScore(m.id, d.id), k = `${m.id}:${d.id}`;
    const dv = draft[k] || { score: s ? s.score : null, tags: s ? s.tags.slice() : [], note: s ? s.note : '' };
    draft[k] = dv;
    const changed = !s || s.score !== dv.score || s.note !== dv.note || s.tags.join() !== dv.tags.join();
    const n = (m.scored || {})[d.id] || 0;
    return `<div class="dram" data-k="${esc(k)}">
      <div class="dram-head">${thumbHtml(d.hidden ? null : d.snap, d.hidden ? d.label : '')}<div style="min-width:0"><div class="dram-title">${esc(d.hidden ? d.snap.title : `${d.label}. ${d.snap.title}`)}</div>
        <div class="dram-sub">${esc([d.hidden ? '' : d.snap.sub, plural(n, 'score')].filter(Boolean).join(', '))}</div></div></div>
      <div class="score-row"><button class="round" type="button" data-step="-0.5" aria-label="Lower score">−</button>
        <input type="range" min="0" max="10" step="0.5" value="${dv.score == null ? 5 : dv.score}" data-range aria-label="Your score for ${esc(d.snap.title)}, 0 to 10">
        <button class="round" type="button" data-step="0.5" aria-label="Raise score">+</button>
        <span class="score-big num${dv.score == null ? ' unset' : ''}" data-big>${dv.score == null ? '–' : dv.score.toFixed(1)}</span></div>
      <div class="chips" role="group" aria-label="What you picked up">${TAGS.map((t) => `<button class="chip" type="button" data-tag="${t}" aria-pressed="${dv.tags.includes(t)}">${t}</button>`).join('')}</div>
      <textarea class="field" data-note id="note-${esc(d.id)}" maxlength="400" placeholder="A note for later (optional)">${esc(dv.note)}</textarea>
      <div class="dram-foot"><span class="saved">${s && !changed ? `<span class="tick">${ICON.tick}</span>Saved` : s ? 'Changed, not saved yet' : 'Not scored yet'}</span>
        <button class="btn small${s && !changed ? '' : ' primary'}" type="button" data-act="save-score"${dv.score == null ? ' disabled' : ''}>${s ? 'Save change' : 'Save score'}</button></div></div>`;
  }).join('');
  if (lineup.length && amDev() && !devTest(m)) html += `<div class="reveal-box"><p>Developer view: your scores stay hidden from everyone, and the club reveals its own.</p></div>`;
  else if (lineup.length) html += `<div class="reveal-box"><p>When everyone’s done, reveal the scores together. They can’t be changed after that.</p>
    <button class="btn primary" type="button" data-act="reveal" id="revealBtn">Reveal scores</button></div>`;
  return html;
}
function resultsHtml(m) {
  const ranked = C.rankDrams(m.lineup || [], scoresFor(m.id));
  const top = ranked[0];
  let html = screenHead('Results', `${longDate(m.at)}${m.place ? `, at ${m.place}` : ''}`);
  if (top && top.avg != null) {
    html += `<section class="hero">${glassSvg(top.avg / 10, `Top dram scored ${top.avg.toFixed(1)} out of 10`)}
      <p class="state-line" style="text-align:center">Top of the night</p>
      <div class="winner"><div class="big num">${top.avg.toFixed(1)}</div></div>
      <h1 class="title" style="text-align:center;margin-top:6px">${esc(top.dram.snap.title)}</h1>
      <p class="facts" style="text-align:center">${esc(`${plural(top.n, 'score')}, from ${top.min.toFixed(1)} to ${top.max.toFixed(1)}`)}</p></section>`;
  } else html += `<p class="empty-body" style="margin-top:18px">Nobody scored anything at this meet.</p>`;
  html += ranked.map((r, i) => {
    const sc = scoresFor(m.id).filter((s) => s.dramId === r.dram.id);
    return `<div class="dram"><div class="dram-head"><span class="rank num">${i + 1}</span>${thumbHtml(r.dram.snap)}<div style="flex:1;min-width:0"><div class="dram-title">${esc(r.dram.snap.title)}</div>
      <div class="dram-sub">${esc(r.n ? `${plural(r.n, 'score')}, ${r.spread === 0 ? 'everyone agreed' : `${r.min.toFixed(1)} to ${r.max.toFixed(1)}`}` : 'No scores')}${m.blind ? `, poured as Dram ${esc(r.dram.label)}` : ''}</div></div>
      <span class="row-score num">${r.avg == null ? '–' : r.avg.toFixed(1)}</span></div>${r.n ? verdictHtml(sc) : ''}
      <div style="margin-top:8px">${shopRow(r.dram.snap, r.dram.whiskyId && S.byId.get(r.dram.whiskyId))}</div></div>`;
  }).join('');
  return html;
}

/* ---------- Drift ---------- */
function driftHtml() {
  if (!S.cat) {
    loadCatalogue();
    return `<section class="hero" style="text-align:center"><img class="loading-mark" src="mark.webp" alt=""${S.catErr ? ' style="animation:none;opacity:.5"' : ''}>
      <p class="facts">${S.catErr ? esc(S.catErr) : 'Opening the cabinet of 6,000 whiskies…'}</p>
      ${S.catErr ? '<div class="actions" style="justify-content:center"><button class="btn" type="button" data-act="cat-retry">Try again</button></div>' : ''}</section>`;
  }
  ensureDrift();
  const counts = C.typeCounts(S.cat);
  const chips = [{ label: 'All', n: S.cat.length }, ...counts].map((c) => `<button class="chip" type="button" data-type="${esc(c.label)}" aria-pressed="${S.set.type === c.label}">${esc(c.label)}<small class="num">${c.n.toLocaleString('en-GB')}</small></button>`).join('');
  const w = S.cur && S.byId.get(S.cur);
  if (!w) return `<div class="drift-bar"><div class="chips scroll">${chips}</div></div><p class="empty-body">No whiskies of that kind in the catalogue.</p>`;
  const facts = C.facts(w);
  const wished = D().wishes.some((x) => x.whiskyId === w.id);
  return `<div class="drift-bar"><div class="chips scroll" role="group" aria-label="Kind of whisky">${chips}</div>
      <button class="icon-btn" type="button" data-act="search" aria-label="Search the catalogue" title="Search">${ICON.search}</button></div>
    <article class="card" id="card" data-id="${esc(w.id)}">
      <div class="pic" id="pic" data-id="${esc(w.id)}"></div>
      <p class="credit" id="credit"></p>
      <h1 class="title">${esc(w.title)}</h1>
      ${w.edition ? `<p class="edition">${esc(w.edition)}</p>` : ''}
      <p class="story">${esc(C.story(w))}</p>
      ${facts.length ? `<p class="facts">${esc(facts.join('. '))}.</p>` : ''}
      <div class="card-actions">
        <a class="act" ${extLink(C.shoppingUrl(C.shopQuery(w.title, w)))} aria-label="Search Google Shopping for ${esc(w.title)}" title="Search Google Shopping"><span class="disc">${ICON.bag}</span>Shop</a>
        ${w.info ? `<a class="act" ${extLink(w.info)} aria-label="Read more about ${esc(w.title)}" title="Read more"><span class="disc">${ICON.info}</span>Read</a>` : ''}
        <button class="act" type="button" data-act="wish" aria-pressed="${wished}" aria-label="${wished ? 'On the wish list' : 'Add to the wish list'}" title="Wish list"><span class="disc">${ICON.heart}</span>${wished ? 'Wished' : 'Wish list'}</button>
        <button class="act accent" type="button" data-act="next" aria-label="Another whisky" title="Another whisky"><span class="disc">${ICON.shuffle}</span>Another</button>
      </div>
    </article>
    ${(S.set.hints || 0) < 4 ? '<p class="hint">Swipe the card for another, or back for the last one.</p>' : ''}
`;
}
function afterDrift() {
  const w = S.cur && S.byId.get(S.cur);
  if (!w) return;
  paintPic(w);
  prefetchNext();
  bindCardSwipe();
}
function showNext(dir) {
  if (!nextDram(dir)) return;
  if (dir > 0 && (S.set.hints || 0) < 4) { S.set.hints = (S.set.hints || 0) + 1; saveSet(); }
  renderMain();
}
function openSearch() {
  openSheet(`${head('Find a whisky')}
    <form class="field-row" id="searchForm" style="margin-top:12px"><input class="field" id="searchQ" placeholder="Name, distillery or region" autocomplete="off" enterkeyhint="search" aria-label="Search the catalogue"></form>
    <div id="searchList"><p class="small" style="margin-top:14px">Try Springbank, Islay, Kentucky or Mizunara.</p></div>`);
  setTimeout(() => { const q = $('#searchQ'); if (q && !isIOS) q.focus(); }, 60);
}
function renderSearch() {
  const q = ($('#searchQ') || {}).value || '', el = $('#searchList');
  if (!el) return;
  if (!q.trim()) { el.innerHTML = '<p class="small" style="margin-top:14px">Try Springbank, Islay, Kentucky or Mizunara.</p>'; return; }
  const res = C.search(S.cat || [], q, 30);
  el.innerHTML = res.length ? `<ul class="rows">${res.map((w) => `<li class="row"><button class="row-main" type="button" data-show="${esc(w.id)}">${thumbHtml({ image: keepPic(w) })}
    <span class="row-text"><span class="row-title">${esc(w.title)}</span><span class="row-sub">${esc([w.edition, C.sub(w)].filter(Boolean).join(', '))}</span></span></button></li>`).join('')}</ul>`
    : `<p class="small" style="margin-top:14px">Nothing in the catalogue matches “${esc(q)}”.</p>`;
}

/* ---------- Cabinet ---------- */
function cabinetHtml() {
  const v = S.cabView;
  let html = `<div class="switcher quiet" role="group" aria-label="Cabinet"><button type="button" data-cab="tasted" aria-pressed="${v === 'tasted'}">Tasted</button><button type="button" data-cab="wish" aria-pressed="${v === 'wish'}">Wish list</button></div>`;
  if (v === 'tasted') {
    const all = C.cabinet(D().meets, D().scores);
    if (!all.length) return html + `<section class="hero" style="margin-top:12px">${glassSvg(0, 'An empty glass')}<h1 class="empty-title">Nothing tasted yet</h1><p class="empty-body">After a meet’s scores are revealed, every dram lands here, best first.</p></section>`;
    const sorted = all.slice().sort(S.cabSort === 'score' ? (a, b) => b.avg - a.avg || b.meet.at - a.meet.at : (a, b) => b.meet.at - a.meet.at);
    html += `<p class="drift-count num" style="margin-top:12px">${esc(plural(all.length, 'dram'))} tasted at ${esc(plural(new Set(all.map((x) => x.meet.id)).size, 'meet'))}</p>
      <div class="chips" style="margin-top:8px" role="group" aria-label="Order"><button class="chip" type="button" data-sort="score" aria-pressed="${S.cabSort === 'score'}">Best first</button><button class="chip" type="button" data-sort="recent" aria-pressed="${S.cabSort === 'recent'}">Most recent</button></div>
      <ul class="rows">${sorted.map((x, i) => `<li class="row"><button class="row-main" type="button" data-dram="${esc(x.meet.id)}:${esc(x.dram.id)}">${S.cabSort === 'score' ? `<span class="rank num">${i + 1}</span>` : ''}${thumbHtml(x.dram.snap)}
        <span class="row-text"><span class="row-title">${esc(x.dram.snap.title)}</span><span class="row-sub">${esc(`${shortDate(x.meet.at)}${x.dram.by ? `, brought by ${x.dram.by === S.me ? 'you' : memberName(x.dram.by) || 'a former member'}` : ''}`)}</span></span>
        <span class="row-score num">${x.avg.toFixed(1)}</span></button></li>`).join('')}</ul>`;
    return html;
  }
  const ws = D().wishes.slice().sort((a, b) => b.votes.length - a.votes.length || b.added - a.added);
  if (!ws.length) return html + `<section class="hero" style="margin-top:12px">${glassSvg(0, 'An empty glass')}<h1 class="empty-title">The wish list is empty</h1><p class="empty-body">In Explore, tap the heart on anything you’d like the club to try. Members vote, and the host picks from here.</p>
    <div class="actions"><button class="btn" type="button" data-tab="drift">Open Explore</button></div></section>`;
  html += `<p class="drift-count num" style="margin-top:12px">${esc(plural(ws.length, 'whisky', 'whiskies'))}, most wanted first</p><ul class="rows">${ws.map((x) => {
    const mine = x.votes.includes(S.me);
    return `<li class="row"><button class="row-main" type="button" data-wishopen="${esc(x.id)}">${thumbHtml(x.snap)}<span class="row-text"><span class="row-title">${esc(x.snap.title)}</span>
      <span class="row-sub">${esc(`Suggested by ${x.by === S.me ? 'you' : memberName(x.by) || 'a former member'}`)}</span></span></button>
      <button class="act" type="button" data-vote="${esc(x.id)}" aria-pressed="${mine}" aria-label="${mine ? 'Take back your vote' : 'Vote for this'}, ${plural(x.votes.length, 'vote')}" title="Vote" style="min-width:52px"><span class="disc" style="width:40px;height:40px">${ICON.heart}</span><span class="num">${x.votes.length}</span></button></li>`;
  }).join('')}</ul>`;
  return html;
}
function openWish(id) {
  const x = D().wishes.find((w) => w.id === id);
  if (!x) return;
  const w = x.whiskyId && S.byId.get(x.whiskyId);
  const voters = x.votes.map((v) => (v === S.me ? 'you' : memberName(v))).filter(Boolean);
  openSheet(`${head(esc(x.snap.title))}
    ${x.snap.edition ? `<p class="edition">${esc(x.snap.edition)}</p>` : ''}
    ${x.snap.image ? `<div class="pic"><img class="on" src="${esc(x.snap.image)}" alt="${esc(x.snap.title)}" referrerpolicy="no-referrer"></div>` : ''}
    <p class="story" style="font-size:16px">${esc(w ? C.story(w) : x.snap.sub || '')}</p>
    <p class="facts">${esc(`Wanted by ${list(voters) || 'nobody yet'}.`)}</p>
    ${shopRow(x.snap, w)}
    <p class="result" id="wishResult"></p>
    <div class="actions"><button class="link-btn danger" type="button" data-unwish="${esc(x.id)}">Take off the wish list</button></div>`);
}

/* ---------- Finds ---------- */
function nextFriday() {
  const d = new Date(); d.setHours(9, 0, 0, 0);
  const add = (5 - d.getDay() + 7) % 7 || (Date.now() > d.getTime() ? 7 : 0);
  d.setDate(d.getDate() + add);
  return d.getTime();
}
function findsHtml() {
  const v = S.findsView || 'latest', picks = D().picks || [];
  let html = `<div class="switcher quiet" role="group" aria-label="Finds"><button type="button" data-fview="latest" aria-pressed="${v === 'latest'}">Latest</button><button type="button" data-fview="picks" aria-pressed="${v === 'picks'}">Worth a look${picks.length ? ` <span class="num" style="opacity:.7">${picks.length}</span>` : ''}</button></div>`;
  return html + (v === 'picks' ? picksHtml(picks) : latestHtml(picks));
}
function heartBtn(attr, id, mine, n, what) {
  return `<button class="act" type="button" ${attr}="${esc(id)}" aria-pressed="${mine}" aria-label="${mine ? 'Take back your vote' : `Vote for ${what}`}, ${plural(n, 'vote')}" title="${mine ? 'Take back your vote' : 'Worth a look'}" style="min-width:52px"><span class="disc" style="width:40px;height:40px">${ICON.heart}</span><span class="num">${n}</span></button>`;
}
function latestHtml(picks) {
  const f = D().finds || [], info = D().findsInfo, used = D().findsManualUsed;
  const when = info ? `Last looked ${ago(info.at)}.` : '';
  const next = `The next look is ${dayWord(nextFriday()) === 'Today' ? 'this morning' : longDate(nextFriday())}, around 9:00.`;
  let html = `<section style="padding-top:12px"><h1 class="title" style="font-size:22px">Limited releases</h1>
    <p class="section-note" style="font-size:14px">${esc(`New limited editions and special releases spotted in the news. Dram looks every Friday and tells the club when there’s something new. ${when} ${used ? next : ''}`)}</p>
    ${info && !info.ok ? `<p class="result">${esc(info.reason)}</p>` : ''}
    ${used ? '' : `<div class="actions"><button class="btn small" type="button" data-act="finds-now">${ICON.search}Look now</button><span class="small">Once for the club, then every Friday</span></div>`}
    <p class="section-note">Tap the heart on anything worth a look, and it joins the club’s list.</p></section>`;
  if (!f.length) return html + `<p class="empty-body" style="margin-top:22px">${used ? 'Nothing spotted yet. Dram looks again on Friday.' : 'Nothing spotted yet. Tap Look now, or wait for Friday.'}</p>`;
  let last = null;
  html += f.map((x) => {
    const k = dayKey(x.published);
    const headTxt = k !== last ? `<h2 class="section-title" style="font-size:14px;color:var(--ink-3);font-weight:500;margin-top:22px">${esc(longDate(x.published))}</h2>` : '';
    last = k;
    const p = picks.find((y) => y.findId === x.id), mine = !!p && p.votes.includes(S.me);
    return `${headTxt}<div class="row"><a class="row-main" ${extLink(x.link)}><span class="row-text"><span class="row-title" style="font-weight:500">${esc(x.title)}</span>
      <span class="row-sub">${esc(x.source || host(x.link))}</span></span></a>${heartBtn('data-pickfind', x.id, mine, p ? p.votes.length : 0, x.title)}</div>`;
  }).join('');
  return html + `<p class="foot">From Google News searches for limited and special whisky releases. Check the retailer’s own page before you buy.</p>`;
}
function picksHtml(picks) {
  if (!picks.length) return `<section class="hero" style="margin-top:12px">${glassSvg(0, 'An empty glass')}<h1 class="empty-title">Nothing worth a look yet</h1>
    <p class="empty-body">In Latest, tap the heart on a release the club should keep an eye on. Members vote, so the most wanted rise to the top.</p>
    <div class="actions"><button class="btn" type="button" data-fview="latest">Open Latest</button></div></section>`;
  const ps = picks.slice().sort((a, b) => b.votes.length - a.votes.length || b.added - a.added);
  return `<p class="drift-count num" style="margin-top:12px">${esc(plural(ps.length, 'release'))}, most wanted first</p><ul class="rows">${ps.map((x) => {
    const mine = x.votes.includes(S.me);
    return `<li class="row"><button class="row-main" type="button" data-pickopen="${esc(x.id)}"><span class="thumb" style="color:var(--sun-ink)">${ICON.tabFinds}</span><span class="row-text"><span class="row-title">${esc(x.title)}</span>
      <span class="row-sub">${esc(`${x.source ? x.source + ', ' : ''}picked by ${x.by === S.me ? 'you' : memberName(x.by) || 'a former member'}`)}</span></span></button>
      ${heartBtn('data-votepick', x.id, mine, x.votes.length, x.title)}</li>`;
  }).join('')}</ul>`;
}
function openFindPick(id) {
  const x = (D().picks || []).find((y) => y.id === id);
  if (!x) return;
  const voters = x.votes.map((v) => (v === S.me ? 'you' : memberName(v))).filter(Boolean);
  openSheet(`${head(esc(x.title))}
    <p class="edition">${esc([x.source, x.published ? longDate(x.published) : ''].filter(Boolean).join(', '))}</p>
    <p class="facts">${esc(`Worth a look for ${list(voters) || 'nobody yet'}.`)}</p>
    <div class="card-actions" style="justify-content:flex-start;gap:18px">
      <a class="act" ${extLink(x.link)} aria-label="Read the article" title="Read the article"><span class="disc">${ICON.info}</span>Read</a>
      <a class="act" ${extLink(C.shoppingUrl(C.shopQuery(x.title)))} aria-label="Search Google Shopping for this release" title="Search Google Shopping"><span class="disc">${ICON.bag}</span>Shop</a></div>
    <p class="result" id="pickResult"></p>
    <div class="actions"><button class="link-btn danger" type="button" data-unpick="${esc(x.id)}">Take off the list</button></div>`);
}

/* ---------- Sheets ---------- */
const sheet = $('#sheet');
function head(title) { return `<div class="grab" data-grab><div class="grabber"></div></div><div class="sheet-head" data-grab><h2 id="sheetTitle">${title}</h2><button class="icon-btn" type="button" data-act="close" aria-label="Close">${ICON.x}</button></div>`; }
function openSheet(html) {
  const b = $('#sheetBody');
  b.innerHTML = html.startsWith('<div class="grab"') ? html : `<div class="grab" data-grab><div class="grabber"></div></div>` + html;
  sheet.style.transform = '';
  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;

const fmtTime = (t) => { if (!isFinite(t) || t < 0) return '0:00'; t = Math.floor(t); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
function loadMedia(force) {
  if (S.mediaBusy) return;
  if (!force && S.media && Date.now() - (S.media.at || 0) < 10 * MIN) return;
  S.mediaBusy = true;
  if (S.tab === 'media') renderMain();
  api('media', force ? { fresh: true } : {}).then((j) => { S.media = j; put('media', j); })
    .catch((err) => { if (force) toast(friendly(err)); })
    .finally(() => { S.mediaBusy = false; if (S.tab === 'media' && !S.screen) renderMain(); });
}
function mediaHtml() {
