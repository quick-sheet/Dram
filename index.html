/* ---------- Actions ---------- */
async function doRsvp(meetId, status, btn) {
  const prev = rsvpOf(meetId, S.me);
  if (prev === status) return;
  btn.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  try { await call('rsvp', { meetId, status }); toast(status === 'in' ? 'You’re in' : status === 'maybe' ? 'Marked as maybe' : 'Marked as can’t come'); }
  catch (err) { toast(friendly(err)); }
  renderAll();
}
async function saveMeet(btn) {
  const e = readEditor(), res = $('#edResult');
  if (!e.at || isNaN(e.at)) { res.textContent = 'Pick a date.'; return; }
  for (const [k, label] of [['slides', 'The slides link'], ['video', 'The song or video link']]) {
    if (e[k] && !/^https:\/\//i.test(e[k])) { res.textContent = `${label} must start with https://`; return; }
  }
  const old = e.id && meetById(e.id);
  await withBusy(btn, async () => {
    res.textContent = '';
    try {
      e.lineup.forEach((d) => { const w = d.whiskyId && S.byId.get(d.whiskyId); const p = w && picFor(w); if (!d.snap.image && p && p.kind === 'bottle') d.snap.image = p.u; });
      // a blind line-up this phone can't see isn't sent: the server keeps the real one
      const payload = { id: e.id, at: e.at, host: e.host, place: e.place, notes: e.notes, slides: e.slides, video: e.video, blind: e.blind, lineup: e.hiddenLineup || e.revealed ? undefined : e.lineup };
      const j = await call('saveMeet', { meet: payload });
      const saved = meetById(j.savedId);
      closeSheet(); S.edit = null; renderAll();
      let told = '';
      if (e.tell && saved) {
        const moved = old && (old.at !== saved.at || old.place !== saved.place);
        if (!old || moved) {
          const title = old ? `Meet moved: ${longDate(saved.at)}` : `New meet: ${longDate(saved.at)}`;
          const ok = await tellClub(title, `${time(saved.at)}. ${meetStory(saved)} Open Dram to say if you’re in.`);
          told = ok ? ' The club has been told.' : ' Couldn’t reach ntfy to tell the club.';
        }
      }
      toast((old ? 'Meet saved.' : 'Meet planned.') + told);
    } catch (err) { res.textContent = friendly(err); toast(friendly(err)); }
  });
}
async function saveScore(card, btn) {
  const k = card.dataset.k, [meetId, dramId] = k.split(':'), dv = draft[k];
  if (dv.score == null) return;
  await withBusy(btn, async () => {
    try {
      await call('score', { meetId, dramId, score: dv.score, tags: dv.tags, note: dv.note });
      const m = meetById(meetId), d = m && m.lineup.find((x) => x.id === dramId);
      delete draft[k];
      renderScreen();
      toast(`Saved your ${dv.score.toFixed(1)} for ${d ? d.snap.title : 'that dram'}`);
    } catch (err) { toast(friendly(err)); }
  });
}
let revealArm = 0;
async function revealScores(btn) {
  const m = meetById(S.screen.meetId);
  const missing = D().members.filter((x) => !(m.scorers || []).includes(x.id)).length;
  if (Date.now() - revealArm > 4000) {
    revealArm = Date.now();
    btn.textContent = missing ? `${plural(missing, 'member')} hasn’t scored. Tap again to reveal` : 'Tap again to reveal for everyone';
    setTimeout(() => { if (btn.isConnected && Date.now() - revealArm >= 4000) btn.textContent = 'Reveal scores'; }, 4100);
    return;
  }
  revealArm = 0;
  await withBusy(btn, async () => {
    try {
      busyToast('Revealing the scores…');
      await call('reveal', { meetId: m.id });
      const fresh = meetById(m.id);
      const top = C.rankDrams(fresh.lineup || [], scoresFor(fresh.id))[0];
      renderScreen();
      $('#screen').scrollTop = 0;
      const ok = await tellClub('Scores are in', top && top.avg != null ? `Top of the night: ${top.dram.snap.title}, ${top.avg.toFixed(1)} from ${plural(top.n, 'score')}. Open Dram for everyone’s notes.` : 'Open Dram for the results.');
      toast(ok ? 'Scores revealed. The club has been told.' : 'Scores revealed.');
    } catch (err) { toast(friendly(err)); }
  });
}
async function toggleWish(btn) {
  const w = S.byId.get(S.cur);
  if (!w) return;
  const ex = D().wishes.find((x) => x.whiskyId === w.id);
  const mine = ex && ex.votes.includes(S.me);
  btn.setAttribute('aria-pressed', 'true');
  await withBusy(btn, async () => {
    try {
      if (mine) { toast('Already on the wish list, with your vote'); return; }
      await call(ex ? 'vote' : 'wish', ex ? { id: ex.id } : { whiskyId: w.id, snap: C.snap(w, keepPic(w)) });
      toast(ex ? 'Your vote is in' : 'Added to the wish list');
    } catch (err) { toast(friendly(err)); btn.setAttribute('aria-pressed', 'false'); }
  });
  if (S.tab === 'drift') { const b = $('[data-act=wish]'); if (b) { const on = D().wishes.some((x) => x.whiskyId === w.id); b.setAttribute('aria-pressed', String(on)); b.lastChild.textContent = on ? 'Wished' : 'Wish list'; } }
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, a');
  if (!t) return;
  const d = t.dataset;
  if (d.theme) { setTheme(d.theme); return; }
  if (d.tab) { closeSheet(); S.tab = d.tab; put('tab', S.tab); renderAll(); window.scrollTo(0, 0); if (S.tab !== 'meet') refresh(true); return; }
  if (d.dismiss) { const x = get('dismissed', {}); x[d.dismiss] = 1; put('dismissed', x); renderNotices(); return; }
  if (d.iam) { S.me = d.iam; put('me', S.me); renderAll(); toast(`Welcome, ${myName()}`); return; }
  if (d.rsvp) { doRsvp(d.meet, d.rsvp, t); return; }
  if (d.dram) { const [mid, did] = d.dram.split(':'); openDram(mid, did); return; }
  if (d.type) { S.set.type = d.type; saveSet(); S.deck = []; S.hist = []; S.cur = null; ensureDrift(); renderMain(); return; }
  if (d.cab) { S.cabView = d.cab; renderMain(); return; }
  if (d.sort) { S.cabSort = d.sort; renderMain(); return; }
  if (d.show) { const w = S.byId.get(d.show); if (w) { if (S.cur) S.hist.push(S.cur); S.cur = w.id; put('drift', S.cur); closeSheet(); renderMain(); window.scrollTo(0, 0); } return; }
  if (d.pickw || d.pickwish) {
    let item;
    if (d.pickw) { const w = S.byId.get(d.pickw); item = lineupItem(w); if (picFor(w) === undefined) findPicture(w, true); }
    else { const x = D().wishes.find((y) => y.id === d.pickwish); item = { id: Math.random().toString(36).slice(2, 8), whiskyId: x.whiskyId, by: x.by, snap: x.snap }; }
    S.edit.lineup.push(item);
    renderEditor();
    toast(`${item.snap.title} added to the line-up`);
    return;
  }
  if (d.unline) { readEditor(); S.edit.lineup = S.edit.lineup.filter((x) => x.id !== d.unline); renderEditor(); return; }
  if (d.vote) {
    const x = D().wishes.find((y) => y.id === d.vote); const was = x && x.votes.includes(S.me);
    t.setAttribute('aria-pressed', String(!was));
    try { await call('vote', { id: d.vote }); toast(was ? 'Vote taken back' : 'Your vote is in'); } catch (err) { toast(friendly(err)); }
    renderMain(); return;
  }
  if (d.wishopen) { openWish(d.wishopen); return; }
  if (d.unwish) { await withBusy(t, async () => { try { await call('unwish', { id: d.unwish }); closeSheet(); renderMain(); toast('Taken off the wish list'); } catch (err) { $('#wishResult').textContent = friendly(err); } }); return; }
  if (d.rename) {
    const m = D().members.find((x) => x.id === d.rename);
    const li = t.closest('li');
    li.innerHTML = `<form class="field-row" data-renameform="${esc(m.id)}" style="flex:1;padding:6px 0"><input class="field" value="${esc(m.name)}" maxlength="30" aria-label="New name"><button class="btn small" type="submit">Rename</button></form>`;
    li.querySelector('input').focus();
    return;
  }
  if (d.remove) {
    const m = D().members.find((x) => x.id === d.remove);
    if (t.dataset.armed !== '1') { t.dataset.armed = '1'; $('#memberResult').textContent = `Tap the × again to remove ${m.name}. Their past scores stay.`; return; }
    await withBusy(t, async () => { try { await call('removeMember', { id: m.id }); openSettings(); toast(`${m.name} removed`); } catch (err) { $('#memberResult').textContent = friendly(err); } });
    return;
  }
  if (d.step) {
    const card = t.closest('.dram'), dv = draft[card.dataset.k];
    dv.score = C.clampScore((dv.score == null ? 5 : dv.score) + +d.step);
    syncDram(card); return;
  }
  if (d.tag) {
    const card = t.closest('.dram'), dv = draft[card.dataset.k];
    dv.tags = dv.tags.includes(d.tag) ? dv.tags.filter((x) => x !== d.tag) : dv.tags.concat(d.tag);
    t.setAttribute('aria-pressed', String(dv.tags.includes(d.tag)));
    syncDram(card, true); return;
  }

  switch (d.act) {
    case 'close': closeSheet(); break;
    case 'retry': withBusy(t, () => refresh(false)); break;
    case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; renderNotices(); } break;
    case 'connect': openConnect(); break;
    case 'connected': S.connected = true; put('connected', true); closeSheet(); renderNotices(); toast('Notifications are set up'); break;
    case 'copy': try { await navigator.clipboard.writeText(D().club.topic); toast('Code copied'); } catch { toast('Press and hold the code to copy it'); } break;
    case 'hello': {
      await withBusy(t, async () => {
        const ok = await tellClub(`${myName()} is on Dram`, 'Club messages arrive here: meet reminders, new meets, revealed scores and limited releases.');
        $('#connectResult').textContent = ok ? `Sent at ${time(Date.now())}. It should appear in ntfy in a few seconds.` : 'Couldn’t reach ntfy. Check your connection and try again.';
        toast(ok ? 'Test sent to the club' : 'Couldn’t reach ntfy');
      });
      break;
    }
    case 'test-reminder': {
      await withBusy(t, async () => {
        const res = $('#testResult');
        try {
          const j = await call('testNotify');
          res.textContent = j.test && j.test.ok ? `Sent at ${time(j.test.at)}. It should reach ntfy within a minute.` : (j.test && j.test.reason) || 'It didn’t send.';
          toast(j.test && j.test.ok ? 'Test reminder sent' : 'The test reminder didn’t send');
        } catch (err) { res.textContent = friendly(err); toast(friendly(err)); }
      });
      break;
    }
    case 'new-meet': openEditor(null); break;
    case 'edit-meet': openEditor(meetById(d.meet)); break;
    case 'ed-blind': readEditor(); S.edit.blind = !S.edit.blind; t.setAttribute('aria-checked', String(S.edit.blind)); break;
    case 'ed-tell': readEditor(); S.edit.tell = !S.edit.tell; t.setAttribute('aria-checked', String(S.edit.tell)); break;
    case 'pick': openPick(); break;
    case 'pick-back': renderEditor(); break;
    case 'pick-custom': {
      const q = ($('#pickQ').value || '').trim();
      if (!q) break;
      S.edit.lineup.push(lineupItem(null, q.slice(0, 120)));
      renderEditor(); toast(`${q} added to the line-up`);
      break;
    }
    case 'save-meet': saveMeet(t); break;
    case 'delete-meet': {
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to delete, with its scores'; setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = 'Delete meet'; } }, 4000); break; }
      await withBusy(t, async () => { try { await call('deleteMeet', { id: S.edit.id }); closeSheet(); S.edit = null; renderAll(); toast('Meet deleted'); } catch (err) { $('#edResult').textContent = friendly(err); } });
      break;
    }
    case 'tasting': openScreen('tasting', d.meet); refresh(true); break;
    case 'results': openScreen('results', d.meet); break;
    case 'screen-back': goBack(); break;
    case 'save-score': saveScore(t.closest('.dram'), t); break;
    case 'reveal': revealScores(t); break;
    case 'next': showNext(1); break;
    case 'wish': toggleWish(t); break;
    case 'search': if (!S.cat) { toast('The whisky list is still loading'); break; } openSearch(); break;
    case 'cat-retry': catPromise = null; S.catErr = ''; renderMain(); loadCatalogue(); break;
    case 'finds-now': {
      await withBusy(t, async () => {
        busyToast('Looking for new limited releases…');
        try { await call('findsNow'); renderMain(); const i = D().findsInfo; toast(i && i.ok ? (i.added ? `${plural(i.added, 'new find')}` : 'Nothing new since the last look') : (i && i.reason) || 'Couldn’t look just now'); }
        catch (err) { toast(friendly(err)); }
      });
      break;
    }
    case 'switch-me': closeSheet(); S.me = ''; put('me', ''); renderAll(); break;
    case 'signout': signOut(''); break;
    case 'save-club': {
      await withBusy(t, async () => {
        const name = $('#clubName').value.trim(), channel = $('#clubChannel').value.trim();
        const res = $('#clubResult');
        if (channel && !/^https:\/\//i.test(channel)) { res.textContent = 'The channel link must start with https://'; return; }
        try { await call('setClub', { name, channel }); res.textContent = 'Saved.'; renderAll(); toast('Club details saved'); } catch (err) { res.textContent = friendly(err); }
      });
      break;
    }
  }
});
$('#themeBtn').addEventListener('click', () => togglePop('themes'));
$('#settingsBtn').addEventListener('click', () => openSettings());
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && popOpen()) { closePops(); $('#themeBtn').focus(); } });

function syncDram(card, keepSaved) {
  const dv = draft[card.dataset.k];
  const big = card.querySelector('[data-big]');
  big.textContent = dv.score == null ? '–' : dv.score.toFixed(1);
  big.classList.toggle('unset', dv.score == null);
  if (dv.score != null) card.querySelector('[data-range]').value = dv.score;
  const [meetId, dramId] = card.dataset.k.split(':');
  const s = myScore(meetId, dramId);
  const changed = !s || s.score !== dv.score || s.note !== dv.note || s.tags.join() !== dv.tags.join();
  const btn = card.querySelector('[data-act=save-score]');
  btn.disabled = dv.score == null;
  btn.classList.toggle('primary', changed);
  card.querySelector('.saved').innerHTML = s && !changed ? `<span class="tick">${ICON.tick}</span>Saved` : s ? 'Changed, not saved yet' : 'Not scored yet';
}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-range]')) { const card = t.closest('.dram'); draft[card.dataset.k].score = C.clampScore(t.value); syncDram(card); }
  else if (t.matches('[data-note]')) { const card = t.closest('.dram'); draft[card.dataset.k].note = t.value; syncDram(card); }
  else if (t.id === 'pickQ') renderPick();
  else if (t.id === 'searchQ') renderSearch();
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'pinForm') {
    const pin = $('#pinIn').value.trim();
    if (!pin) return;
    const btn = f.querySelector('button');
    await withBusy(btn, async () => {
      S.pin = pin;
      try { await call('state'); put('pin', pin); S.gateErr = ''; renderAll(); }
      catch (err) { S.pin = ''; S.gateErr = friendly(err); $('#gateErr').textContent = S.gateErr; }
    });
    return;
  }
  if (f.id === 'newMember' || f.id === 'addMemberForm') {
    const inp = f.querySelector('input'), name = inp.value.trim();
    if (!name) return;
    await withBusy(f.querySelector('button'), async () => {
      try {
        await call('addMember', { name });
        if (f.id === 'newMember') { const m = D().members.find((x) => x.name.toLowerCase() === name.toLowerCase()); if (m) { S.me = m.id; put('me', S.me); } renderAll(); toast(`Welcome, ${name}`); }
        else { openSettings(); toast(`${name} added`); }
      } catch (err) { if (f.id === 'addMemberForm') $('#memberResult').textContent = friendly(err); else toast(friendly(err)); }
    });
    return;
  }
  if (f.dataset.renameform) {
    const name = f.querySelector('input').value.trim();
    await withBusy(f.querySelector('button'), async () => {
      try { await call('renameMember', { id: f.dataset.renameform, name }); renderAll(); openSettings(); toast('Name changed'); } catch (err) { $('#memberResult').textContent = friendly(err); }
    });
  }
});

/* ---------- Gestures ---------- */
// One helper: decide the direction after 10px; only a sideways (or downward) drag is ours.
function drag(el, opts) {
  let st = null;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { st = null; return; }
    const t = e.touches[0], tg = e.target;
    if (tg.closest('input, textarea, select') || (opts.skip && opts.skip(tg, t))) { st = null; return; }
    if (String(getSelection && getSelection()).length) { st = null; return; }
    st = { x: t.clientX, y: t.clientY, t: Date.now(), dir: null, dx: 0, dy: 0 };
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (!st) return;
    const t = e.touches[0];
    st.dx = t.clientX - st.x; st.dy = t.clientY - st.y;
    if (!st.dir) {
      if (Math.hypot(st.dx, st.dy) < 10) return;
      const horiz = Math.abs(st.dx) > Math.abs(st.dy);
      st.dir = opts.axis === 'y' ? (!horiz && st.dy > 0 ? 'y' : 'none') : horiz ? 'x' : 'none';
      if (st.dir === 'none') { st = null; return; }
      if (opts.axis === 'x' && opts.onlyRight && st.dx < 0) { st = null; return; }
    }
    e.preventDefault();
    opts.move(st);
  }, { passive: false });
  const end = () => {
    if (!st || !st.dir) { st = null; return; }
    const v = (opts.axis === 'y' ? st.dy : st.dx) / Math.max(1, Date.now() - st.t);
    opts.end(st, v);
    st = null;
  };
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', () => { if (st && st.dir) opts.cancel && opts.cancel(st); st = null; });
}
const scrollsSideways = (el) => {
  for (let n = el; n && n !== document.body; n = n.parentElement) {
    const ox = getComputedStyle(n).overflowX;
    if ((ox === 'auto' || ox === 'scroll') && n.scrollWidth > n.clientWidth) return true;
  }
  return false;
};
const edgeSkip = (tg, t) => scrollsSideways(tg) || (!standalone && t.clientX < 24);
const springBack = (el) => { el.style.transition = reduced() ? 'none' : 'transform .22s ease'; el.style.transform = ''; setTimeout(() => { el.style.transition = ''; }, 240); };
const arrow = (p) => { const a = $('#backArrow'); a.innerHTML = ICON.back; a.style.opacity = String(Math.min(1, p)); };

// Full-screen layer: swipe right to go back
drag($('#screen'), {
  axis: 'x', onlyRight: true, skip: edgeSkip,
  move: (st) => { const dx = Math.max(0, st.dx); if (!reduced()) $('#screen').style.transform = `translateX(${dx}px)`; arrow(dx / (innerWidth / 3)); },
  end: (st, v) => {
    const el = $('#screen');
    arrow(0);
    if (st.dx > innerWidth / 3 || v > 0.5) {
      if (!reduced()) { el.style.transition = 'transform .18s ease-out'; el.style.transform = `translateX(${innerWidth}px)`; }
      setTimeout(() => { el.style.transition = ''; goBack(); }, reduced() ? 0 : 180);
    } else springBack(el);
  },
  cancel: () => { arrow(0); springBack($('#screen')); },
});
// Sheets: drag the handle or title down to close
drag(sheet, {
  axis: 'y', skip: (tg) => !tg.closest('[data-grab]') || tg.closest('button'),
  move: (st) => { if (!reduced()) sheet.style.transform = `translateY(${Math.max(0, st.dy)}px)`; },
  end: (st, v) => {
    if (st.dy > sheet.offsetHeight / 4 || v > 0.5) {
      if (!reduced()) { sheet.style.transition = 'transform .18s ease-out'; sheet.style.transform = `translateY(${sheet.offsetHeight}px)`; }
      setTimeout(() => { sheet.style.transition = ''; closeSheet(); }, reduced() ? 0 : 180);
    } else springBack(sheet);
  },
  cancel: () => springBack(sheet),
});
// Drift card: swipe left for another, right for the last one
let cardBound = null;
function bindCardSwipe() {
  const card = $('#card');
  if (!card || card === cardBound) return;
  cardBound = card;
  drag(card, {
    axis: 'x', skip: (tg) => scrollsSideways(tg),
    move: (st) => { if (!reduced()) card.style.transform = `translateX(${st.dx}px) rotate(${st.dx / 40}deg)`; },
    end: (st, v) => {
      const go = Math.abs(st.dx) > innerWidth / 3 || Math.abs(v) > 0.5;
      if (!go) { springBack(card); return; }
      const dir = st.dx < 0 ? 1 : -1;
      if (dir < 0 && !S.hist.length) { springBack(card); toast('That’s the first one this time'); return; }
      if (reduced()) { showNext(dir); return; }
      card.style.transition = 'transform .16s ease-in, opacity .16s';
      card.style.transform = `translateX(${dir > 0 ? -innerWidth : innerWidth}px) rotate(${dir > 0 ? -8 : 8}deg)`;
      card.style.opacity = '0';
      setTimeout(() => showNext(dir), 160);
    },
    cancel: () => springBack(card),
  });
}

/* ---------- Opening screen ---------- */
const splashFrom = performance.now();
let splashGone = false;
function hideSplash() {
  if (splashGone) return;
  splashGone = true;
  const el = $('#splash');
  const wait = Math.max(0, 900 - (performance.now() - splashFrom));   // long enough to read, never longer than needed
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 500); }, reduced() ? Math.min(wait, 300) : wait);
}

/* ---------- Start ---------- */
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; renderNotices(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.pin) refresh(true); });
window.addEventListener('online', () => { if (S.pin) refresh(true); });
setInterval(() => { if (S.tab === 'meet' && !S.screen && !sheet.open && S.me && document.visibilityState === 'visible') renderMain(); }, 60000);
(function start() {
  $('#themeBtn').innerHTML = ICON.eye; $('#settingsBtn').innerHTML = ICON.sliders; $('#channelBtn').innerHTML = ICON.play;
  setTheme(S.set.theme);
  renderAll();
  // Signed in with saved data: the app is ready at once. Signed in without it: wait for the club, up to 2.5 s.
  if (S.pin && !S.data) { refresh(true).then(hideSplash); setTimeout(hideSplash, 2500); }
  else { hideSplash(); if (S.pin) refresh(true); }
  if (S.tab === 'drift' || S.me) setTimeout(loadCatalogue, S.tab === 'drift' ? 0 : 1500);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
